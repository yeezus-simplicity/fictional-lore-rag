<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fictional-lore-rag · 替身数据检索问答</title>
<style>
/* ============================================================
   设计约束（刻意不用 AI 味写法）：
   - 深色系，非紫蓝渐变
   - 等宽字体只用于代码/数字，不用全站 monospace
   - 边框半径小（4px），不用超大圆角
   - 阴影克制，不用发光/玻璃拟态
   ============================================================ */
:root {
  --bg: #14161a;
  --bg-panel: #1c1f25;
  --bg-hover: #23262d;
  --border: #2e323a;
  --border-strong: #3d424c;
  --text: #e2e5ea;
  --text-dim: #9aa0ab;
  --text-faint: #6b7280;
  --accent: #4a9eff;
  --accent-dim: #2d5a99;
  --ok: #3fb950;
  --warn: #d29922;
  --err: #f85149;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
}
/* 顶栏 */
header {
  border-bottom: 1px solid var(--border);
  padding: 14px 22px;
  display: flex;
  align-items: center;
  gap: 18px;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}
header h1 { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
header .sub { color: var(--text-faint); font-size: 12px; }
/* 服务状态灯 */
#dot { font-size: 11px; margin-right: 4px; color: var(--text-faint); }
#dot.ok { color: var(--ok); }
#dot.bad { color: var(--err); }
#dot.wait { color: var(--warn); }
nav { display: flex; gap: 2px; margin-left: auto; }
nav button {
  background: none; border: 1px solid transparent; color: var(--text-dim);
  padding: 5px 13px; cursor: pointer; font-size: 13px; border-radius: 4px;
}
nav button:hover { color: var(--text); background: var(--bg-hover); }
nav button.on {
  color: var(--text); border-color: var(--border-strong);
  background: var(--bg-panel);
}
/* 布局 */
.wrap { max-width: 1180px; margin: 0 auto; padding: 22px; }
.view { display: none; }
.view.on { display: block; }
/* 查询框 */
.qbox { display: flex; gap: 8px; margin-bottom: 18px; }
input[type=text] {
  flex: 1; background: var(--bg-panel); border: 1px solid var(--border);
  color: var(--text); padding: 10px 13px; border-radius: 4px; font-size: 14px;
}
input[type=text]:focus {
  outline: none; border-color: var(--accent-dim);
}
button.go {
  background: var(--accent-dim); border: 1px solid var(--accent);
  color: #fff; padding: 10px 22px; border-radius: 4px; cursor: pointer;
  font-size: 14px; font-weight: 500;
}
button.go:hover { background: var(--accent); }
button.go:disabled { opacity: .5; cursor: wait; }
/* 模式切换 */
.modes { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.mlabel { color: var(--text-faint); font-size: 12px; }
.mbtn {
  background: var(--bg-panel); border: 1px solid var(--border);
  color: var(--text-dim); padding: 4px 13px; border-radius: 3px;
  font-size: 13px; cursor: pointer;
}
.mbtn:hover { color: var(--text); border-color: var(--border-strong); }
.mbtn.on { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
.mhint { color: var(--text-faint); font-size: 11.5px; margin-left: 4px; }
.mhint.gen { color: var(--warn); }
/* 生成式信息卡 */
.geninfo {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 11.5px; color: var(--text-faint);
}
.geninfo b { color: var(--text-dim); font-weight: 500; }
.fbar {
  height: 3px; background: var(--bg-hover); border-radius: 2px;
  margin-top: 3px; overflow: hidden;
}
.fbar i { display: block; height: 100%; background: var(--ok); }
.fbar i.warn { background: var(--warn); }
.fbar i.bad { background: var(--err); }
/* 示例问句 */
.samples {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px;
}
.samples span { color: var(--text-faint); font-size: 12px; margin-right: 4px; }
.chip {
  background: var(--bg-panel); border: 1px solid var(--border);
  color: var(--text-dim); padding: 4px 10px; border-radius: 3px;
  font-size: 12px; cursor: pointer;
}
.chip:hover { border-color: var(--accent-dim); color: var(--text); }
/* 卡片 */
.card {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: 5px; padding: 16px; margin-bottom: 12px;
}
.card h3 {
  font-size: 12px; color: var(--text-dim); font-weight: 600;
  text-transform: uppercase; letter-spacing: .8px; margin-bottom: 12px;
}
/* ================================================================
   M17：雷达图 + 图片
   ================================================================ */
.media-block {
  margin-top: 16px; padding-top: 14px;
  border-top: 1px solid var(--border);
}
.media-title {
  font-size: 11px; color: var(--text-dim); letter-spacing: .8px;
  text-transform: uppercase; margin-bottom: 10px;
}
.media-title .cnt, .img-group-t .cnt {
  display: inline-block; margin-left: 6px; padding: 1px 6px;
  border-radius: 3px; background: var(--bg-panel); color: var(--accent);
  font-size: 10px; font-family: var(--mono);
}
.radar-wrap {
  display: flex; justify-content: center; padding: 4px 0 2px;
}
/* 图片网格：按类别分组，缩略图可点开 */
.img-group { margin-bottom: 14px; }
.img-group-t {
  font-size: 12px; color: var(--text); margin-bottom: 8px;
  font-weight: 600;
}
.img-grid {
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  align-items: start;
}
.shot { margin: 0; }
.shot img {
  /* ★ M19：完整显示，绝不裁切 ★
     之前是 `aspect-ratio:1/1 + object-fit:cover` —— cover 为了填满正方形
     会**裁掉**图片边缘。实测本地 74 张图里 **51 张是竖图**
     （宽高比中位 0.83，最窄 0.37，即 400x1068 的长立绘），
     所以正方形裁切必然把头尾切掉—— 用户反馈"大多图片显示不全"。
     → object-fit: contain（完整显示，留白用面板底色填充）
     → 高度由 JS 按图片真实宽高比设置（见 applyShotHeights），
        这样竖图自然更高、横图更矮，排列整齐又不裁内容。 */
  width: 100%;
  height: 170px;                /* 兜底高度，JS 会按真实比例覆盖 */
  object-fit: contain;
  border: 1px solid var(--border); border-radius: 4px;
  background: var(--bg-page); cursor: zoom-in; display: block;
  transition: border-color .15s ease;
}
.shot img:hover { border-color: var(--accent); }
.shot figcaption {
  margin-top: 4px; font-size: 10px; color: var(--text-dim);
  text-align: center; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap;
}
.img-note {
  margin-top: 8px; font-size: 10px; color: var(--text-dim); opacity: .8;
}
/* ★ M18：图片后台抓取中的占位 */
.img-wait {
  display: flex; align-items: center; gap: 10px;
  padding: 14px; border: 1px dashed var(--border); border-radius: 4px;
  font-size: 12px; color: var(--text-dim);
}
.spin {
  width: 13px; height: 13px; flex: 0 0 13px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spin { animation: none; }
}
/* 点击放大的浮层 */
.zoom {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,.88); display: none;
  align-items: center; justify-content: center; cursor: zoom-out;
  padding: 24px;
}
.zoom img {
  max-width: 100%; max-height: 100%;
  border: 1px solid var(--border); border-radius: 4px;
}
/* 路由标记 */
.route {
  display: inline-block; padding: 2px 8px; border-radius: 3px;
  font-size: 11px; font-family: var(--mono); margin-right: 8px;
}
.route.structured { background: #1c3a2e; color: var(--ok); }
.route.semantic  { background: #1e2f4a; color: var(--accent); }
.route.hybrid    { background: #3d2f1a; color: var(--warn); }
.route.abstain   { background: #4a1f1f; color: var(--err); }
/* 答案 */
.answer { font-size: 15px; line-height: 1.75; white-space: pre-wrap; }
.answer-refused { color: var(--warn); }
.meta { color: var(--text-faint); font-size: 12px; margin-top: 10px; }
/* 警告 */
.alert {
  border-left: 3px solid var(--warn); background: #2a2415;
  padding: 9px 13px; border-radius: 0 3px 3px 0; margin-top: 12px;
  font-size: 13px; color: #e8c56a;
}
.alert.err { border-color: var(--err); background: #2a1a1a; color: #f0958f; }
/* 答案类型分发 */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; }
.kv dt { color: var(--text-faint); }
.kv dd { font-family: var(--mono); font-size: 12px; }
.tag {
  display: inline-block; padding: 1px 7px; border-radius: 2px;
  font-size: 11px; font-family: var(--mono);
  background: var(--bg-hover); color: var(--text-dim);
  margin: 2px 4px 2px 0;
}
/* 证据 */
details.ev { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
details.ev summary {
  cursor: pointer; color: var(--text-dim); font-size: 12px;
  list-style: none; user-select: none;
}
details.ev summary::-webkit-details-marker { display: none; }
details.ev summary:before { content: "▸ "; color: var(--text-faint); }
details.ev[open] summary:before { content: "▾ "; }
details.ev summary:hover { color: var(--text); }
.ev-item {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 3px; padding: 10px 12px; margin-top: 8px;
}
.ev-head {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  font-size: 11px; font-family: var(--mono); color: var(--text-faint);
  margin-bottom: 6px;
}
.ev-text { font-size: 12.5px; line-height: 1.65; color: var(--text-dim); }
/* 检索过程 */
.steps { counter-reset: s; }
.step {
  position: relative; padding: 8px 0 8px 32px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.step:last-child { border-bottom: none; }
.step:before {
  counter-increment: s; content: counter(s);
  position: absolute; left: 0; top: 8px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--bg-hover); color: var(--text-dim);
  font-size: 11px; display: flex; align-items: center;
  justify-content: center; font-family: var(--mono);
}
.step .t { color: var(--text); }
.step .d { color: var(--text-faint); font-size: 12px; margin-top: 2px; }
.step.hit:before { background: var(--accent-dim); color: #fff; }
.step.miss:before { background: #3d1f1f; color: var(--err); }
/* 表格 */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td {
  text-align: left; padding: 7px 11px;
  border-bottom: 1px solid var(--border);
}
th { color: var(--text-faint); font-size: 11px; text-transform: uppercase;
     letter-spacing: .5px; font-weight: 600; }
tr:hover td { background: var(--bg-hover); }
td.num { font-family: var(--mono); font-size: 12px; text-align: right; }
/* 冲突 */
.c-cat { font-family: var(--mono); font-size: 11px; }
.c-cat.UNKNOWN { color: var(--warn); }
.c-cat.INFINITE { color: var(--accent); }
.c-cat.RANKED { color: var(--ok); }
.c-cat.EMPTYSLOT { color: var(--text-faint); }
.c-cat.UNCATEGORIZED { color: var(--text-dim); }

/* ---- M22：冲突消解对照卡 ---- */
/* 深色主题（--bg #14161a），沿用同一套变量 */
.cf-sum {
  font-size: 13px; color: var(--text-dim); margin-bottom: 14px;
  padding: 10px 14px; background: var(--bg-panel);
  border: 1px solid var(--border); border-radius: 8px;
}
.cf-sum b { color: var(--text); }
.cf-card {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 14px; overflow: hidden;
}
/* 保留未知的卡片弱化显示 —— 它是**刻意的决策**，不是失败 */
.cf-card.is-pending { border-color: var(--border); opacity: .82; }
.cf-card.is-pending .cf-head { border-left: 3px solid var(--text-faint); }
.cf-card:not(.is-pending) .cf-head { border-left: 3px solid var(--ok); }

.cf-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  background: var(--bg-hover);
}
.cf-stand { font-weight: 600; font-size: 15px; color: var(--text); }
.cf-dim {
  font-size: 12px; color: var(--accent);
  border: 1px solid var(--accent-dim); border-radius: 4px;
  padding: 1px 7px;
}
.cf-part { font-size: 11px; color: var(--text-faint); }
.cf-state {
  margin-left: auto; font-size: 11px; padding: 2px 9px;
  border-radius: 10px; white-space: nowrap;
}
.cf-state.p { color: var(--text-faint); border: 1px solid var(--border-strong); }
.cf-state.r { color: var(--ok); border: 1px solid var(--ok); }

.cf-srcs { width: 100%; border-collapse: collapse; }
.cf-srcs td {
  padding: 7px 14px; font-size: 12px;
  border-bottom: 1px solid var(--border);
}
.cf-src { color: var(--text-dim); font-family: var(--mono); font-size: 11px; }
.cf-vs { color: var(--text-faint); text-align: center; width: 34px; font-size: 11px; }
.cf-v { font-family: var(--mono); }
/* 纯等级：大号醒目 */
.cf-v.cf-grade { font-size: 16px; font-weight: 700; color: var(--text); }
.cf-v.cf-grade.is-pick { color: var(--accent); }
/* 说明性文本（源A 常见 36 字符的 ?※… 说明）：小字压灰，避免撑破布局 */
.cf-v.cf-text {
  font-size: 11px; color: var(--text-faint);
  display: inline-block; max-width: 260px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  vertical-align: bottom;
}
.cf-v.cf-none { color: var(--text-faint); }

.cf-foot { padding: 10px 14px; }
.cf-line {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 12px; margin-bottom: 6px;
}
.cf-line:last-child { margin-bottom: 0; }
.cf-k { color: var(--text-faint); font-size: 11px; }
.cf-tag {
  font-family: var(--mono); font-size: 11px;
  border: 1px solid var(--border-strong); border-radius: 4px;
  padding: 1px 7px; color: var(--text-dim);
}
.cf-reason { color: var(--text-dim); }
.cf-reason span:last-child { flex: 1; min-width: 200px; }
.cf-noreason { color: var(--text-faint); font-style: italic; }

/* 置信度小进度条 */
.cf-conf { display: inline-flex; align-items: center; gap: 6px; }
.cf-conf-bar {
  display: inline-block; width: 66px; height: 5px;
  background: var(--border-strong); border-radius: 3px; overflow: hidden;
}
.cf-conf-bar i { display: block; height: 100%; }
.cf-conf b { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }

/* 敏感性：脆弱 → 警示色；稳健 → 中性 */
.cf-sens { font-size: 11px; }
.cf-sens.ok { color: var(--text-faint); }
.cf-sens.bad { color: var(--warn); }

/* ---- M25：多轮追问（指代消解）提示 ---- */
.coref {
  margin-top: 10px; padding-top: 9px;
  border-top: 1px dashed var(--border-strong);
  font-size: 12px; display: flex; align-items: center;
  gap: 7px; flex-wrap: wrap;
}
.cf-pron { color: var(--warn); font-family: var(--mono); }
.cf-arrow { color: var(--text-faint); }
.cf-target { color: var(--accent); font-weight: 600; }
.cf-from { color: var(--text-faint); font-size: 11px; }
#newChat {
  border: 1px solid var(--border-strong); background: transparent;
  color: var(--text-dim); border-radius: 6px; padding: 6px 12px;
  font-size: 12px; cursor: pointer;
}
#newChat:hover { background: var(--bg-hover); color: var(--text); }

/* ---- M32：中文摘要卡（替身档案） ---- */
.zh-card {
  border: 1px solid var(--border-strong); border-left: 3px solid var(--accent);
  border-radius: 8px; padding: 14px 16px; margin-bottom: 14px;
  background: var(--bg-panel);
}
.zc-title { font-size: 13px; font-weight: 500; margin-bottom: 10px; }
.zc-title span { font-weight: 400; font-size: 11px; color: var(--text-faint); }
.zc-row { display: flex; gap: 12px; padding: 4px 0; font-size: 13px; }
.zc-k { flex: 0 0 52px; color: var(--text-faint); font-size: 12px; padding-top: 1px; }
.zc-v { flex: 1; color: var(--text); }
.zc-sub { color: var(--text-dim); font-size: 12px; margin-left: 8px; }
.zc-dims { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.zc-dim { font-size: 12px; color: var(--text-dim); }
.zc-dim b { color: var(--accent); font-weight: 600; margin-left: 3px; }
.zc-dim b.zc-na { color: var(--text-faint); font-weight: 400; font-size: 11px; }

/* ---- M32：英文原文折叠 ---- */
.en-fold { border: 1px dashed var(--border-strong); border-radius: 6px; padding: 8px 12px; }
.en-fold summary { cursor: pointer; font-size: 12px; color: var(--text-dim); }
.en-fold summary:hover { color: var(--text); }
.en-body { margin-top: 10px; white-space: pre-wrap; line-height: 1.7;
  font-size: 13px; color: var(--text-dim); }

/* ---- M32：相似替身 ---- */
.sim-scope { font-weight: 400; font-size: 11px; color: var(--text-faint); }
.sim-list { display: flex; flex-direction: column; gap: 8px; }
.sim-item { border: 1px solid var(--border); border-radius: 6px;
  padding: 10px 12px; cursor: pointer; transition: background .15s; }
.sim-item:hover { background: var(--bg-hover); border-color: var(--border-strong); }
.sim-name { font-size: 13px; font-weight: 500; color: var(--text); }
.sim-meta { font-size: 11px; color: var(--text-faint); margin-top: 3px; }
.sim-diff { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.sd { font-size: 11px; color: var(--text-dim); font-family: var(--mono); }
.sim-note { margin-top: 10px; padding-top: 8px;
  border-top: 1px dashed var(--border-strong); font-size: 11px; }

.ok { color: var(--ok); } .bad { color: var(--err); }
.empty { color: var(--text-faint); font-size: 13px; padding: 22px; text-align: center; }
.loading { color: var(--text-dim); font-size: 13px; padding: 18px; }
</style>
</head>
<body>

<header>
  <h1>fictional-lore-rag</h1>
  <span class="sub">替身数据混合检索问答</span>
  <span id="dot" title="服务状态">●</span><span id="dotTxt" class="sub">连接中</span>
  <nav>
    <button class="on" data-v="q">问答</button>
    <button data-v="b">数据浏览</button>
    <button data-v="c">冲突记录</button>
    <button data-v="s">系统状态</button>
  </nav>
</header>

<div class="wrap">

<!-- ══════════ 问答 ══════════ -->
<div class="view on" id="v-q">
  <div class="qbox">
    <input type="text" id="qi" placeholder="问一个问题，例如：Star Platinum 的破坏力是几级？"
           autocomplete="off">
    <button class="go" id="qb">查询</button>
    <button id="newChat" title="清空上下文，下次追问不再引用上一轮对象">新对话</button>
  </div>
  <!-- ★ M11：抽取式 / 生成式 对比 -->
  <div class="modes">
    <span class="mlabel">回答方式</span>
    <button class="mbtn on" id="mExtract"
            title="返回数据源原文片段。零生成、零幻觉、秒级响应">抽取式</button>
    <button class="mbtn" id="mGenerate"
            title="Qwen2.5-1.5B 生成。带忠实度约束，但慢约 5 秒">生成式</button>
    <span class="mhint" id="mHint">返回原文片段，不生成任何内容</span>
  </div>
  <div class="samples">
    <span>试试：</span>
  </div>

  <div id="rout"></div>

  <!-- 检索过程 -->
  <div class="card" id="procCard" style="display:none">
    <h3>检索过程</h3>
    <div class="steps" id="proc"></div>
  </div>

  <!-- 答案 -->
  <div id="ans"></div>
</div>

<!-- ══════════ 数据浏览 ══════════ -->
<div class="view" id="v-b">
  <div class="qbox">
    <input type="text" id="bi" placeholder="输入替身名或 stand_id，如：Star Platinum / star_platinum"
           autocomplete="off">
    <button class="go" id="bb">查询</button>
  </div>
  <div class="samples" id="bSamples"><span>试试：</span></div>
  <div id="bans"></div>
</div>

<!-- ══════════ 冲突 ══════════ -->
<div class="view" id="v-c">
  <div style="margin-bottom:14px">
    <button class="chip" onclick="loadC('all')">全部</button>
    <button class="chip" onclick="loadC('pending')">待消解</button>
    <button class="chip" onclick="loadC('resolved')">已消解</button>
  </div>
  <div id="cans" class="loading">加载中…</div>
</div>

<!-- ══════════ 状态 ══════════ -->
<div class="view" id="v-s">
  <div id="sans" class="loading">加载中…</div>
</div>

</div>

<script>
const API = location.origin;
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SAMPLES = [
  'Star Platinum 的破坏力是几级？',
  '所有替身中，破坏力最高的是哪个？',
  'Made in Heaven 的速度是多少？',
  'Tusk 的射程是多少？',
  '使用者 Giorno Giovanna 有哪些替身？',
  'Anubis 的外观形态方面有哪些描述？',
  'Star Platinum Ultimate 的能力值是多少？'
];
$('.samples').insertAdjacentHTML('beforeend',
  SAMPLES.map(q=>`<span class="chip" onclick="ask('${esc(q)}')">${esc(q)}</span>`).join(''));
$('#bSamples').insertAdjacentHTML('beforeend',
  ['Star Platinum','The World','Made in Heaven','Tusk','Anubis']
    .map(n=>`<span class="chip" onclick="askB('${esc(n)}')">${esc(n)}</span>`).join(''));

// ★★ M22 修 bug：数据浏览的「查询」按钮**从未绑定任何事件** ★★
//   askB() 本身是支持读输入框的（n 缺省时取 $('#bi').value），
//   但 #bb 上没有 onclick / addEventListener →
//   用户手动输入替身名后点「查询」**毫无反应**，
//   只有点下面那几个示例 chip 才能查。
//   ★ 这是「接口全绿但前端不能用」的典型：脚本一测就发现，
//     纯接口测试永远发现不了。
$('#bb').onclick = () => askB();
$('#bi').addEventListener('keydown', e => {
  if(e.key === 'Enter') askB();
});

// ★ M25：同一个教训 —— 新加的按钮必须绑事件
$('#newChat').onclick = () => resetSession();
$('#qi').addEventListener('keydown', e => {
  if(e.key === 'Enter') ask();
});

// ---------- 模式切换（M11）----------
let MODE = 'extract';
const HINTS = {
  extract: '返回原文片段，不生成任何内容',
  generate: 'Qwen2.5-1.5B 生成 · 忠实度约束 · 约 5 秒',
};
$('#mExtract').onclick = () => setMode('extract');
$('#mGenerate').onclick = () => setMode('generate');

// ★★★ M18修一个静默失效的 bug ★★★
//   查询按钮 #qb 与输入框回车**从未绑定事件** —— 只有下面的示例 chip
//   用了 inline onclick="ask(...)"，所以点示例能查、手打输入却毫无反应
//   （实测：填好问句点「查询」，页面连"检索中…"都不显示，
//     因为根本没发请求。用户会以为服务挂了。）
$('#qb').onclick = () => ask();
$('#qi').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); ask(); }
});

function setMode(m){
  MODE = m;
  $('#mExtract').classList.toggle('on', m==='extract');
  $('#mGenerate').classList.toggle('on', m==='generate');
  const h = $('#mHint');
  h.textContent = HINTS[m];
  h.classList.toggle('gen', m==='generate');
}

// ---------- 服务状态灯 ----------
// ★ 教训：界面本身能打开不代表服务活着 —— 静态 HTML 是本地文件，
//   API 才需要后端。加个探活，用户不用靠「查询失败」才发现服务挂了。
async function ping(){
  const dot=$('#dot'), txt=$('#dotTxt');
  try{
    const r = await fetch(API+'/health', {cache:'no-store'});
    const d = await r.json();
    // ★ M12：把索引配置显示出来 ——
    //   换索引会直接改变检索质量，用户必须能一眼看出当前用的哪套，
    //   否则「结果变好了 / 变差了」都无从归因。
    const idx = (d.chunk_merge_target
      ? `合并${d.chunk_merge_target}`
      : `原始${d.n_chunks||'?'}`);
    if(d.status==='ok'){
      dot.className='ok'; dot.title='服务正常';
      txt.textContent = `已连接 · ${d.vector_enabled?'混合检索':'BM25'} · ${idx}`;
    }else{
      dot.className='wait'; dot.title='数据库降级中';
      txt.textContent=`已连接·降级 · ${idx}`;
    }
  }catch(e){
    dot.className='bad'; dot.title='服务未启动';
    txt.textContent='服务未启动';
  }
}
ping();
setInterval(ping, 10000);

// ---------- 视图切换 ----------
document.querySelectorAll('nav button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    $('#v-'+b.dataset.v).classList.add('on');
    if(b.dataset.v==='c') loadC('all');
    if(b.dataset.v==='s') loadS();
  };
});
$('#qi').onkeydown = e => { if(e.key==='Enter') ask(); };
$('#bi').onkeydown = e => { if(e.key==='Enter') askB(); };

// ---------- 问答 ----------
// ---------- M25：多轮会话 ----------
// ★ 会话 id 存 localStorage：刷新页面后上下文还在（符合用户直觉）。
//   点「新对话」换一个 id，等价于清空上下文。
function newSessionId(){
  return 's-' + Date.now().toString(36) + '-' +
         Math.random().toString(36).slice(2, 8);
}
let SID = localStorage.getItem('ragkb_sid');
if(!SID){ SID = newSessionId(); localStorage.setItem('ragkb_sid', SID); }

function resetSession(){
  SID = newSessionId();
  localStorage.setItem('ragkb_sid', SID);
  $('#ans').innerHTML = '';
  $('#rout').innerHTML = '<div class="card"><div class="meta">' +
    '已开启新对话 —— 上下文已清空（下次追问不再引用上一轮对象）</div></div>';
}

async function ask(q){
  q = (q!==undefined? q : $('#qi').value).trim();
  if(!q) return;
  $('#qb').disabled = true;
  $('#rout').innerHTML = '<div class="card"><div class="loading">检索中…</div></div>';
  $('#ans').innerHTML = '';
  $('#procCard').style.display = 'none';
  try{
    // ★ /query 的参数是 **query string**（q / top_k），不是 JSON body
    //   实测踩坑：按 body 传 {question:...} → 422 Unprocessable Content
    const r = await fetch(`${API}/query?` +
      new URLSearchParams({q:q, top_k:'3', mode:MODE, session_id:SID}),
      {method:'POST'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    render(await r.json());
    ping();                    // 顺带刷新状态灯
  }catch(e){
    // ★「Failed to fetch」是浏览器级错误，分不清是服务没起还是网络问题。
    //   给可操作的提示，而不是把原始英文抛给用户。
    $('#rout').innerHTML = `
      <div class="card">
        <h3>无法连接到服务</h3>
        <div class="alert err">
          ${esc(e.message)}
          <div style="margin-top:10px">
            最可能的原因：<b>API 服务已停止</b>。它在独立进程里运行，
            关掉终端或进程被回收后界面就无法查询。
          </div>
        </div>
        <div class="meta" style="margin-top:12px">
          重新启动：在<b>项目根目录</b>执行 <code>python start.py</code><br>
          或 <code>python api/main.py --no-vector</code><br>
          再打开 <code>http://127.0.0.1:8765</code>
        </div>
        <div class="meta" style="margin-top:8px">
          当前页面地址：<code>${esc(location.href)}</code><br>
          界面请求的地址：<code>${esc(location.origin)}</code>
          ${location.port==='8765' ? '' : '<br>★ 端口不是 8765 —— 请用服务实际输出的端口地址'}
        </div>
      </div>`;
  }
  $('#qb').disabled = false;
}

function render(d){
  // 路由卡
  // ★ M25：指代消解提示 —— 只有在**真的发生了替换**时才显示，
  //   让用户看得见系统把「它」理解成了谁（不然追问出错时无从判断）
  const cf = d.coref;
  const cfHtml = cf ? `
      <div class="coref">
        <span class="cf-pron">「${esc(cf.pronoun)}」</span>
        <span class="cf-arrow">→</span>
        <span class="cf-target">${esc(cf.resolved_to)}</span>
        <span class="cf-from">承接上一轮「${esc(cf.from_question||'')}」</span>
      </div>` : '';
  $('#rout').innerHTML = `
    <div class="card">
      <span class="route ${esc(d.route)}">${esc(d.route)}</span>
      <span class="meta" style="display:inline">${esc(d.route_reason)}</span>
      <div class="meta">${d.elapsed_ms.toFixed(0)} ms · 答案类型 ${esc(d.answer_type)}
        ${d.confidence!=null? ' · 置信度 '+d.confidence : ''}</div>
      ${cfHtml}
    </div>`;
  renderProcess(d);
  renderAnswer(d);
}

function renderProcess(d){
  const steps = [];
  steps.push({cls:'', t:'路由判定',
    d:`识别为 <b>${esc(d.route)}</b> —— ${esc(d.route_reason)}`});
  // ★ M25：把消解过程也放进「处理过程」，可追溯
  if(d.coref){
    steps.push({cls:'hit', t:'指代消解',
      d:`「${esc(d.coref.pronoun)}」→ <b>${esc(d.coref.resolved_to)}</b>`
        + (d.coref.from_question
           ? `（来自上一轮「${esc(d.coref.from_question)}」）` : '')});
  }
  const ev = d.evidence||[];
  if(d.retrieval_meta){
    const rm = d.retrieval_meta;
    if(rm.retrieval) steps.push({cls:'', t:'检索',
      d:`${esc(rm.retrieval)}${rm.rrf_k?'（RRF k='+rm.rrf_k+'）':''}`});
  }
  ev.forEach((e,i)=>{
    steps.push({cls:'hit', t:`证据 ${i+1}`,
      d:`${esc(e.type)}`
        + (e.stand_name? ` · ${esc(e.stand_name)}`:'')
        + (e.chunk_type? ` · ${esc(e.chunk_type)}`:'')
        + (e.chunk_id!=null? ` · #${e.chunk_id}`:'')
        + (e.table? ` · 表 ${esc(e.table)}`:'')
        + (e.field? ` · 字段 ${esc(e.field)}`:'')});
  });
  if(!ev.length) steps.push({cls:'miss', t:'无证据', d:'未检索到相关片段'});
  steps.push({cls:'', t:'生成/组织',
    d: d.answer_type==='snippet'? '抽取式：直接返回原文片段（零生成）'
      : '抽取式：结构化查询直接返回字段值（零生成）'});
  $('#proc').innerHTML = steps.map(s=>
    `<div class="step ${s.cls}"><div class="t">${s.t}</div><div class="d">${s.d}</div></div>`
  ).join('');
  $('#procCard').style.display = '';
}

// ★★ M32：中文摘要卡 ★★
//   用户反馈「答案返回一堆英文介绍看不懂」。
//   根因：语料全部来自 jojowiki 英文站（2407/2407 块都是英文）。
//   ★ 处理方式刻意**不用机器翻译** —— 那会破坏「证据可追溯」这个
//     项目的立身之本。改用**本来就有中文的数据**拼一张卡：
//     中文名 / 日文原名 / 使用者 / 登场部数 / 六维中文等级 / 类型。
//   英文原文仍然保留（下面折叠展示），中文只是「看得懂的第一层」。
function renderZhCard(zc){
  if(!zc) return '';
  const names = [zc.name_en, zc.name_ja].filter(Boolean);
  const rows = [];
  rows.push(`<div class="zc-row"><span class="zc-k">名称</span>
    <span class="zc-v"><b>${esc(zc.name_zh||zc.name_en||'—')}</b>
    ${names.length? `<span class="zc-sub">${esc(names.join(' · '))}</span>`:''}</span></div>`);
  if(zc.owner) rows.push(`<div class="zc-row"><span class="zc-k">使用者</span>
    <span class="zc-v">${esc(zc.owner)}
    ${zc.owner_en? `<span class="zc-sub">${esc(zc.owner_en)}</span>`:''}</span></div>`);
  if(zc.part) rows.push(`<div class="zc-row"><span class="zc-k">登场</span>
    <span class="zc-v">第 ${esc(String(zc.part))} 部</span></div>`);
  if(zc.type) rows.push(`<div class="zc-row"><span class="zc-k">类型</span>
    <span class="zc-v">${esc(zc.type)}</span></div>`);
  if(zc.stats_cn){
    const s = Object.entries(zc.stats_cn)
      .map(([k,v])=>`<span class="zc-dim">${esc(k)}
        <b class="${v?'':'zc-na'}">${v?esc(v):'无数据'}</b></span>`).join('');
    rows.push(`<div class="zc-row"><span class="zc-k">六维</span>
      <span class="zc-v zc-dims">${s}</span></div>`);
  }
  return `<div class="zh-card">
    <div class="zc-title">替身档案
      <span>（中文信息，来自结构化数据 · 也可直接用日文名或英文名提问）</span>
    </div>
    ${rows.join('')}
  </div>`;
}

function renderAnswer(d){
  const a = d.answer;
  let body = '';
  let refused = false;

  if(a && a.abstained){ refused = true; body = esc(a.reason);
    if(a.hint) body += '\n\n提示：' + esc(a.hint);
  }
  else if(typeof a==='string'){
    // ★ 生成式：answer 是自然语言字符串
    body = esc(a);
  }
  else if(Array.isArray(a)){
    // ★ M32：英文原文**默认收起** —— 中文档案卡已经在上面给了要点。
    //   用户的原话是「答案返回一堆英文介绍看不懂」，
    //   所以默认不该再甩一大段英文；想看原文的点一下展开即可。
    body = `<details class="en-fold">
      <summary>展开英文原文（${a.length} 段，语料来源 jojowiki）</summary>
      <div class="en-body">${a.map(x=>esc(x)).join('\n\n')}</div></details>`;
  }
  else if(a && typeof a==='object'){
    body = renderStructured(a);
  }
  else body = esc(String(a ?? '（无内容）'));

  let html = `${renderZhCard(d.zh_card)}<div class="card">
    <h3>答案${d.mode==='generate'?' <span style="color:var(--warn);font-weight:400">（生成式）</span>':''}</h3>
    <div class="answer ${refused?'answer-refused':''}">${body}</div>`;
  if(d.warning) html += `<div class="alert">⚠ ${esc(d.warning)}</div>`;
  if(d.generation) html += renderGeneration(d.generation, d.faithfulness);
  // ★★ M17：六维雷达图 + 替身图片
  html += renderMedia(d);
  html += renderEvidence(d.evidence);
  html += '</div>';
  html += '<div id="simBox"></div>';   // ★ M32：相似替身占位
  $('#ans').innerHTML = html;
  // ★ M19：图片渲染完按真实宽高比调整卡片高度（否则竖图留大片空白）
  applyShotHeights($('#ans'));
  // ★ M32：异步拉相似替身 —— 不阻塞主答案（它是增强项）
  if(d.zh_card && d.zh_card.stand_id) loadSimilar(d.zh_card.stand_id);
}

// ★★ M32：相似替身（按六维数值）★★
//   ★ 刻意用数值距离而不是向量索引：能力相似本来就该看六维，
//     且不依赖 7 GB 模型（--no-vector 下也能用）。
//   ★ 后端只在**共同维度 ≥3** 时才给推荐，不足会返回 note 说明原因。
function loadSimilar(sid){
  fetch(`${API}/similar/${encodeURIComponent(sid)}?k=5`)
    .then(r=>r.json())
    .then(d=>{
      const box = document.getElementById('simBox');
      if(!box) return;
      if(d.error){ box.innerHTML = ''; return; }
      const list = d.similar || [];
      const head = `<div class="card"><h3>相似替身
        <span class="sim-scope">${esc(d.scope||'')}</span></h3>`;
      if(!list.length){
        box.innerHTML = head +
          `<div class="meta">${esc(d.note||'数据不足，暂不给出推荐')}</div></div>`;
        return;
      }
      const items = list.map(x=>{
        const diffs = Object.entries(x.diff||{}).slice(0,6)
          .map(([k,v])=>`<span class="sd">${esc(k)} ${v>0?'+':''}${v}</span>`)
          .join('');
        return `<div class="sim-item" role="button" tabindex="0"
             onclick='ask(${JSON.stringify((x.name_zh || x.name) + ' 的六维能力')})'>
          <div class="sim-name">${esc(x.name_zh || x.name)}
            ${x.name_zh? `<span class="zc-sub">${esc(x.name)}</span>`:''}</div>
          <div class="sim-meta">距离 ${x.distance} · 共同维度 ${x.common_dims}</div>
          <div class="sim-diff">${diffs}</div>
        </div>`;
      }).join('');
      box.innerHTML = head + `<div class="sim-list">${items}</div>
        ${d.note? `<div class="meta sim-note">${esc(d.note)}</div>`:''}</div>`;
    })
    .catch(()=>{ /* 相似替身是增强项，失败不影响主答案 */ });
}

/* ================================================================
   M17：雷达图 + 图片渲染
   ================================================================ */
const IMG_KIND_CN = {
  stand:'替身本体', user:'替身使者', manga:'漫画截图',
  anime:'动画截图', misc:'其他'
};

function renderMedia(d){
  let out = '';
  // ---- 雷达图（接口返回的是内联 SVG 字符串）----
  if(d.radar_svg && d.radar_svg.includes('<svg')){
    out += `<div class="media-block">
      <div class="media-title">六维能力</div>
      <div class="radar-wrap">${d.radar_svg}</div>
    </div>`;
  }
  // ---- 图片：已就绪直接渲染；未就绪显示进度并轮询（M18）----
  const im = d.stand_images || {};
  const groups = ['stand','user','manga','anime','misc'];
  const has = groups.some(k => (im[k]||[]).length);
  if(has){
    out += imgSectionHTML(im);
  }else if(im.state === 'pending'){
    // ★ 后台抓图中 —— 给占位 + 启动轮询，不再让用户干等
    out += `<div class="media-block" id="imgPending">
      <div class="media-title">相关图片</div>
      <div class="img-wait">
        <span class="spin"></span>图片正在后台抓取（约 10-30 秒），
        抓完会自动出现在这里，不必重复提问
      </div>
    </div>`;
    pollImages(im.stand_id);
  }else if(im.error){
    out += `<div class="media-block">
      <div class="media-title">相关图片</div>
      <div class="img-note">未能获取：${esc(im.error)}</div></div>`;
  }
  return out;
}

/* 图片区块 HTML（已就绪时） */
function imgSectionHTML(im){
  const groups = ['stand','user','manga','anime','misc'];
  const secs = groups.map(k=>{
    const arr = im[k]||[];
    if(!arr.length) return '';
    const cells = arr.map(x=>
      `<figure class="shot">
         <img src="${esc(x.url)}" alt="${esc(IMG_KIND_CN[k]||k)}"
              loading="lazy" onclick="zoomImg('${esc(x.url)}')">
         <figcaption title="${esc(x.caption||'')}">${esc(IMG_KIND_CN[k]||k)}</figcaption>
       </figure>`).join('');
    return `<div class="img-group">
        <div class="img-group-t">${esc(IMG_KIND_CN[k]||k)}
          <span class="cnt">${arr.length}</span></div>
        <div class="img-grid">${cells}</div>
      </div>`;
  }).join('');
  return `<div class="media-block" id="imgDone">
    <div class="media-title">相关图片 <span class="cnt">${im.total||0}</span></div>
    ${secs}
    <div class="img-note">分类按 jojowiki 源文件名推断（悬停缩略图可看原名）；
      版权归荒木飞吕彦 / 集英社所有，来源 jojowiki.com</div>
  </div>`;
}

/* ★ M19：按图片真实宽高比设高度，让竖图不被压扁、也不留大片空白。
   实测本地 74 张图里 **51 张是竖图**（宽高比中位 0.83、最窄 0.37，
   即 400x1068 的长立绘），另有 20 张横图（最宽 4.76:1）。
   → 固定高度 + cover：竖图被裁头尾（用户反馈"显示不全"）
   → 固定高度 + contain：横图被撑高、下方大片空白
   → 所以按真实比例算高度：卡片高度 = 宽度 × (h/w)，
     下限 96px（横图最扁时也够看）、上限 420px（超长立绘不再更高）。 */
function applyShotHeights(root){
  if(!root) return;
  root.querySelectorAll('.shot img').forEach(img=>{
    const fit = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      if(!w || !h) return;              // 还没加载完，load 事件会再调一次
      const boxW = img.clientWidth || (img.parentElement?.clientWidth) || 160;
      let target = Math.round(boxW * (h / w));   // 按真实比例算高度
      target = Math.max(96, Math.min(420, target));
      img.style.height = target + 'px';
    };
    if(img.complete && img.naturalWidth) fit();
    else img.addEventListener('load', fit, {once:true});
  });
  // 列数随窗口宽度变，尺寸变了要重算高度
  clearTimeout(window._shotRz);
  window._shotRz = setTimeout(()=>applyShotHeights(root), 200);
}

/* ★ M18：轮询图片抓取状态（最多约 60 秒，1.5 秒一次） */
let _imgPollTimer = null;
function pollImages(standId){
  if(!standId) return;
  if(_imgPollTimer) clearTimeout(_imgPollTimer);
  let tries = 0;
  const tick = async ()=>{
    tries++;
    if(tries > 40){                       // 60 秒还没好就放弃，不打扰用户
      const el = document.getElementById('imgPending');
      if(el) el.innerHTML = '<div class="img-note">图片抓取超时，'
        + '可稍后重新提问，或运行 fetch_stand_images.py 手动抓取</div>';
      return;
    }
    try{
      const r = await fetch(`/images/status/${encodeURIComponent(standId)}`);
      if(!r.ok) throw new Error('HTTP '+r.status);
      const im = await r.json();
      if(im.state === 'done' && im.total > 0){
        const el = document.getElementById('imgPending');
        if(el){
          const tmp = document.createElement('div');
          tmp.innerHTML = imgSectionHTML(im);
          const newEl = tmp.firstElementChild;
          el.replaceWith(newEl);
          // ★ M19：异步插入的图也要按真实比例调高度
          applyShotHeights(newEl);
        }
        return;                            // 完成，停止轮询
      }
      if(im.state === 'failed'){
        const el = document.getElementById('imgPending');
        if(el) el.innerHTML = '<div class="img-note">图片抓取失败：'
          + esc(im.error||'未知原因') + '</div>';
        return;
      }
    }catch(e){ /* 网络抖动就继续轮询 */ }
    _imgPollTimer = setTimeout(tick, 1500);
  };
  _imgPollTimer = setTimeout(tick, 1200);
}

function renderStructured(a){
  const t = a.type;
  // ★ 降级提示（DB 不可用时 answer 是 {note, hint}，没有 type 字段）
  if(a.note && !t){
    return `<div style="color:var(--warn)">${esc(a.note)}</div>` +
           (a.hint? `<div class="meta" style="margin-top:8px">${
             esc(a.hint)}</div>` : '');
  }
  if(t==='fact'){
    return `<dl class="kv">
      <dt>替身</dt><dd>${esc(a.stand_name)}</dd>
      <dt>维度</dt><dd>${esc(a.dimension_cn)}（${esc(a.dimension)}）</dd>
      <dt>数值</dt><dd>${esc(a.value_label ?? '—')}</dd>
      <dt>原始值</dt><dd>${esc(a.raw ?? '—')}</dd>
      <dt>类别</dt><dd>${esc(CAT_CN[a.category]||a.category)}
        <span class="c-cat ${esc(a.category)}">${esc(a.category)}</span></dd>
    </dl>`;
  }
  if(t==='extreme' || t==='extreme_top'){
    const items = a.winners || a.items || [];
    return `<div style="margin-bottom:8px">${esc(a.dimension_cn)} ${esc(a.direction||'最高')}
      = <b>${esc(a.value_label ?? (items[0]&&items[0].label) ?? '—')}</b></div>
      <div>${items.map(x=>`<span class="tag">${esc(x.name)}</span>`).join('')}</div>`;
  }
  if(t==='count' || t==='count_by_level'){
    return `<dl class="kv"><dt>范围</dt><dd>${esc(a.scope||a.dimension_cn)}</dd>
      <dt>数量</dt><dd><b>${esc(a.count)}</b></dd></dl>`;
  }
  if(t==='owner'){
    return `<dl class="kv"><dt>替身</dt><dd>${esc(a.stand_name)}</dd>
      <dt>使用者</dt><dd><b>${esc(a.owner)}</b></dd></dl>`;
  }
  if(t==='stands_of_owner'){
    return `<div style="margin-bottom:8px">${esc(a.owner)} 的替身（${a.count} 个）</div>
      <div>${(a.stands||[]).map(x=>`<span class="tag">${esc(x.name)}</span>`).join('')}</div>`;
  }
  // ★★ M20：「XX 的替身是什么」→ 直接给替身名。
  //   用户要的就是这一个词，所以放最上面、加粗放大，
  //   不再糊一整段能力介绍。
  if(t==='stand_of'){
    const st=a.stands||[];
    // ★ M21：有中文名就并列显示（替身英文名 + 中文名）
    const names = st.map(x=> x.zh
        ? `${esc(x.name)}<span style="font-size:15px;color:var(--text-dim);
            margin-left:8px">${esc(x.zh)}</span>`
        : esc(x.name));
    return `<div style="margin-bottom:10px">
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px">
          ${esc(a.owner)} 的替身${a.count>1? `（${a.count} 个）`:''}
        </div>
        <div style="font-size:22px;font-weight:700;line-height:1.5;
                    color:var(--text)">${names.join('、')}</div>
        ${st.some(x=>x.part)? `<div class="meta" style="margin-top:8px">
          ${st.map(x=>`${esc(x.zh||x.name)}${x.part?`（第${esc(x.part)}部）`:''}`).join('　')}
        </div>`:''}
      </div>`;
  }
  if(t==='forms'){
    return `<div>${esc(a.stand_name)} 共 <b>${a.count}</b> 个形态</div>
      <div>${(a.items||[]).map(x=>`<span class="tag">${esc(x.form_id||x)}</span>`).join('')}</div>`;
  }
  if(t==='part_stats'){
    return `<table><thead><tr><th>部</th><th>名称</th>
      <th style="text-align:right">替身数</th>

      ${(a.parts||[]).map(p=>`<tr><td>${p.part}</td><td>${esc(p.name)}</td>

  }

    esc(JSON.stringify(a,null,2))}</pre>`;
}

function renderGeneration(g, f){
  // ---- 生成层详情 ----
  const model = (g.model||'').split('\\').pop();
  let h = `<div class="geninfo"><b>生成层</b>：${esc(model)}`
        + ` · ${esc(g.device||'')} · temp=${g.temperature}`
        + `<br><b>token</b>：prompt ${g.n_prompt_tokens} → gen ${g.n_gen_tokens}`
        + `<br><b>耗时</b>：生成 ${g.elapsed_ms} ms`
        + (g.load_ms>1000? `（含首次加载 ${(g.load_ms/1000).toFixed(0)} s）`:'');
  // ---- 忠实度（机械核对，不是 LLM 判分）----
  if(f && !f.error){
    const t = f.trace_ratio;
    const cls = t>=0.95?'ok':(t>=0.7?'warn':'bad');
    const num = (f.numeric_ratio==null? null : f.numeric_ratio);
    h += `<br><b>忠实度</b>（机械核对）：溯源
      <span class="${cls}" style="font-family:var(--mono)">${
        t==null?'n/a':t.toFixed(2)}</span>`;
    if(num!=null) h+= ` · 数值 ${num.toFixed(2)}`;
    if(f.contradiction_rate>0) h+= ` · <span class="bad">矛盾 ${f.contradiction_rate.toFixed(2)}</span>`;
    if(f.hedging) h+= ` · <span style="color:var(--warn)">空洞回答</span>`;
    h += `<div class="fbar"><i class="${cls}" style="width:${
      Math.round((t||0)*100)}%"></i></div>`;
    h += `<span style="font-size:11px">${
      t>=0.95?'几乎完全忠于证据':
      t>=0.7?'大部分有据，少部分超出证据':'★ 有明显超出证据的内容'}</span>`;
  }else if(f && f.error){
    h += `<br><span class="bad">忠实度计算失败：${esc(f.error)}</span>`;
  }
  return h + `</div>`;
}

// ---------- 冲突 ----------
async function loadC(status){
  $('#cans').innerHTML = '<div class="loading">加载中…</div>';
  try{
    const r = await fetch(`${API}/conflicts?status=${status}&limit=200`);
    const d = await r.json();
    const list = d.conflicts || d.items || [];
    if(!list.length){ $('#cans').innerHTML='<div class="empty">没有符合条件的记录</div>'; return; }

    // ★★ M22：按 (替身, 维度) **分组** ★★
    //   实测一个 (替身,维度) 可能有多条冲突记录——
    //   那是**同一主源对比了多个镜像源**（如 tusk_act3/RNG 同时对比
    //   csv_topology 和 csv_bogdan），不是重复数据。
    //   → 一张卡片 = 一个 (替身,维度)，内部列出全部源对比行。
    const groups = new Map();
    list.forEach(c=>{
      const k = `${c.stand_id}|${c.dim||c.stat_dim}`;
      if(!groups.has(k)) groups.set(k, []);
      groups.get(k).push(c);
    });

    // 字段名以**后端为准**：dim / value_a / source_a / value_b / type
    // ★ M22 修 bug：原先读 c.dimension / c.primary_value / c.category
    //   与后端字段对不上 → 维度、主源、镜像源、类别四列**恒为空**。
    const isGrade = v => /^[A-E]$/.test(String(v??'').trim());

    // 一个「值」的渲染：纯等级用大号等宽；说明性文本用小字灰色
    //   （源A jojowiki 常有 '?※Power: Likely A (JoJoveller p.245)' 这类
    //    36 字符的说明，直接大号显示会撑破布局）
    const valCell = (v, cls) => {
      if(v===null || v===undefined || v==='')
        return `<span class="cf-v cf-none">—</span>`;
      const s = String(v);
      if(isGrade(s)) return `<span class="cf-v cf-grade ${cls||''}">${esc(s)}</span>`;
      return `<span class="cf-v cf-text ${cls||''}" title="${esc(s)}">${esc(s)}</span>`;
    };

    // 置信度小进度条
    const confBar = c => {
      if(c===null || c===undefined) return '';
      const pct = Math.round(Number(c)*100);
      const col = pct>=80 ? 'var(--ok)' : pct>=60 ? 'var(--warn)' : 'var(--err)';
      return `<span class="cf-conf"><span class="cf-conf-bar">
        <i style="width:${pct}%;background:${col}"></i></span>
        <b>${pct}%</b></span>`;
    };

    // 敏感性：维基/库里用 **脆弱** 标记（Markdown 粗体），转成警示色
    const sens = s => {
      if(!s) return '';
      const frag = /脆弱/.test(s);
      const txt = esc(String(s).replace(/\*\*/g,''));
      return `<span class="cf-sens ${frag?'bad':'ok'}">
        ${frag?'⚠':'✓'} ${txt}</span>`;
    };

    const STRAT = {prefer_primary:'采主源', keep_unknown:'保留未知',
                   split_by_form:'按形态拆分'};

    const cards = [...groups.values()].map(rows=>{
      const h = rows[0];
      const dim = h.dim || h.stat_dim || '';
      const dimCn = h.dim_cn || dim;
      const resolved = h.resolved_value;
      const pending = (resolved===null || resolved===undefined);
      // 源对比行：第一行是主源参考，其余行交替展示 主源 vs 该镜像源
      const srcRows = rows.map(x=>`
        <tr>
          <td class="cf-src">${esc(x.source_a||'—')}</td>
          <td>${valCell(x.value_a)}</td>
          <td class="cf-vs">vs</td>
          <td class="cf-src">${esc(x.source_b||'—')}</td>
          <td>${valCell(x.value_b)}</td>
        </tr>`).join('');
      return `<div class="cf-card ${pending?'is-pending':''}">
        <div class="cf-head">
          <span class="cf-stand">${esc(h.stand_name||h.stand_id)}</span>
          <span class="cf-dim">${esc(dimCn)}</span>
          ${h.part?`<span class="cf-part">第${esc(h.part)}部</span>`:''}
          <span class="cf-state ${pending?'p':'r'}">${pending?'保留未知':'已消解'}</span>
        </div>
        <table class="cf-srcs"><tbody>${srcRows}</tbody></table>
        <div class="cf-foot">
          <div class="cf-line">
            <span class="cf-k">采纳</span>
            ${pending
              ? `<span class="cf-v cf-none" title="刻意的保留未知，不是失败">保留未知</span>`
              : valCell(h.resolved_label ?? resolved, 'is-pick')}
            <span class="cf-k">策略</span>
            <span class="cf-tag">${esc(STRAT[h.resolution]||h.resolution||'—')}</span>
            ${confBar(h.confidence)}
          </div>
          ${h.rationale
            ? `<div class="cf-line cf-reason">
                 <span class="cf-k">理由</span>
                 <span>${esc(String(h.rationale).replace(/\*\*/g,''))}</span></div>`
            : `<div class="cf-line cf-reason cf-noreason">
                 <span class="cf-k">理由</span>
                 <span>该条无消解日志（初始状态）</span></div>`}
          ${h.sensitivity?`<div class="cf-line">${sens(h.sensitivity)}</div>`:''}
        </div>
      </div>`;
    }).join('');

    // 顶部：总数 + 状态分布（未消解 = 刻意的保留未知，值得标出来）
    const nPend = list.filter(c=>c.resolved_value===null
                          || c.resolved_value===undefined).length;
    $('#cans').innerHTML = `<div class="cf-sum">
        <b>${groups.size}</b> 组冲突 · 共 ${list.length} 条源对比 ·
        <span class="cf-state p">保留未知 ${nPend}</span>
        <span class="cf-state r">已消解 ${list.length-nPend}</span>
      </div>${cards}`;
  }catch(e){
    $('#cans').innerHTML = `<div class="card"><div class="alert err">${esc(e.message)}</div></div>`;
  }
}

      <div class="card"><h3>冲突消解统计</h3>
        <table><thead><tr><th>维度</th><th style="text-align:right">总数</th>
          <th style="text-align:right">已定值</th><th style="text-align:right">未消解</th>
          <th style="text-align:right">状态</th></tr></thead><tbody>
        ${Object.entries(rs).map(([k,v])=>`
          <tr><td>${esc(dn[v.n]??k)}</td>
            <td class="num">${v.n}</td><td class="num">${v.n_resolved}</td>
            <td class="num bad">${v.n-v.n_resolved}</td>
            <td class="num">${v.n?(v.n_resolved/v.n*100).toFixed(0):0}%</td></tr>`).join('')}
        </tbody></table></div>
      <div class="card"><h3>数据质量</h3>
        <pre style="font-size:12px;white-space:pre-wrap">${
          esc(JSON.stringify(st.data_quality||st, null, 2))}</pre></div>`;
  }catch(e){
    $('#sans').innerHTML = `<div class="card"><div class="alert err">${esc(e.message)}</div></div>`;
  }
}
</script>
</body>
</html>
