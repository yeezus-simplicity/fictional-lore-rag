<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fictional-lore-rag · 替身数据检索问答</title>
<style>
/* ============================================================
   设计约束（刻意不用 AI 味写法）：
   - 深色系，非紫蓝渐变
   - 等宽字体只用于代码/数字，不用全站 monospace
   - 边框半径小（4px），不用超大圆角
   - 阴影克制，不用发光/玻璃拟态
   ============================================================ */
:root {
  --bg: #14161a;
  --bg-panel: #1c1f25;
  --bg-hover: #23262d;
  --border: #2e323a;
  --border-strong: #3d424c;
  --text: #e2e5ea;
  --text-dim: #9aa0ab;
  --text-faint: #6b7280;
  --accent: #4a9eff;
  --accent-dim: #2d5a99;
  --ok: #3fb950;
  --warn: #d29922;
  --err: #f85149;
  --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
}
/* ★★ M57：顶栏（M54 曾改成左侧全局侧栏，按用户要求改回）★★
   用户原话：「我不是让你把这个改回去吗 我要的导航栏是搜索结果出来后
   能够导航到各个部分 如答案 替身资料 检索过程 图片」——
   即：全局导航归位到顶部，左侧留给**结果页内的板块导航**（见 .res-toc）。 */
header {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding: 10px 22px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
}
.brand-name { font-size: 15px; font-weight: 600; letter-spacing: .3px; }
.brand-sub { font-size: 11px; color: var(--text-faint); }
.head-meta {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
}
nav { display: flex; gap: 2px; margin-left: auto; }
nav button {
  background: none; border: 1px solid transparent; color: var(--text-dim);
  padding: 5px 13px; cursor: pointer; font-size: 13px; border-radius: 4px;
}
nav button:hover { color: var(--text); background: var(--bg-hover); }
nav button.on {
  color: var(--text); border-color: var(--border-strong);
  background: var(--bg-panel);
}
/* 服务状态灯 */
#dot { font-size: 11px; margin-right: 4px; color: var(--text-faint); }
#dot.ok { color: var(--ok); }
#dot.bad { color: var(--err); }
#dot.wait { color: var(--warn); }
.side-stat { color: var(--text-faint); }
/* ★ M56：网页构建号 + 「你看到的是旧页面」自检提示 */
.side-ver { color: var(--text-faint); }
.side-ver b { font-weight: 500; color: var(--text-dim);
              font-family: var(--mono); }
.side-warn { color: var(--warn); margin-top: 4px; line-height: 1.5; }
/* 布局 */
.wrap { max-width: 1260px; margin: 0 auto; padding: 22px; }
.view { display: none; }
.view.on { display: block; }

/* ★★ M57：结果页内的**板块导航**（左侧索引）★★
   用户要的正是这个：搜索出结果后能跳到 答案 / 替身资料 / 检索过程 / 图片。
   · 只在结果里有 >1 个板块时出现（hidden 由 JS 控制，避免无意义的一栏）
   · sticky 常驻；点击平滑滚动；滚动时自动高亮当前板块（scroll-spy） */
.result { display: flex; gap: 18px; align-items: flex-start; }
.res-toc {
  flex: 0 0 132px; width: 132px;
  position: sticky; top: 64px;              /* 让开 sticky 顶栏 */
  display: flex; flex-direction: column; gap: 2px;
}
.rt-title { font-size: 11px; color: var(--text-faint); margin-bottom: 4px; }
.rt-item {
  display: block; width: 100%; padding: 5px 9px; cursor: pointer;
  font-size: 12px; color: var(--text-dim); text-align: left;
  background: none; border: none; border-left: 2px solid transparent;
  border-radius: 0 4px 4px 0;
}
.rt-item:hover { color: var(--text); background: var(--bg-hover); }
.rt-item.on {
  color: var(--text); background: var(--bg-panel);
  border-left-color: var(--accent);
}
.res-main { flex: 1 1 auto; min-width: 0; }
/* 锚点跳转时给 sticky 顶栏留出高度，别让标题被挡住 */
.res-main [data-sec] { scroll-margin-top: 72px; }
/* 窄屏：索引变成一行横排 chip（仍可点），不挤压正文 */
@media (max-width: 860px) {
  .result { flex-direction: column; gap: 10px; }
  .res-toc {
    position: static; width: 100%; flex: 0 0 auto;
    flex-direction: row; flex-wrap: wrap; gap: 4px;
  }
  .rt-title { display: none; }
  .rt-item {
    width: auto; border-left: none; border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 10px;
  }
  .wrap { padding: 16px; }
}
/* 查询框 */
.qbox { display: flex; gap: 8px; margin-bottom: 18px; }
input[type=text] {
  flex: 1; background: var(--bg-panel); border: 1px solid var(--border);
  color: var(--text); padding: 10px 13px; border-radius: 4px; font-size: 14px;
}
input[type=text]:focus {
  outline: none; border-color: var(--accent-dim);
}
button.go {
  background: var(--accent-dim); border: 1px solid var(--accent);
  color: #fff; padding: 10px 22px; border-radius: 4px; cursor: pointer;
  font-size: 14px; font-weight: 500;
}
button.go:hover { background: var(--accent); }
button.go:disabled { opacity: .5; cursor: wait; }
/* 模式切换 */
.modes { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.mlabel { color: var(--text-faint); font-size: 12px; }
.mbtn {
  background: var(--bg-panel); border: 1px solid var(--border);
  color: var(--text-dim); padding: 4px 13px; border-radius: 3px;
  font-size: 13px; cursor: pointer;
}
.mbtn:hover { color: var(--text); border-color: var(--border-strong); }
.mbtn.on { background: var(--accent-dim); border-color: var(--accent); color: #fff; }
.mhint { color: var(--text-faint); font-size: 11.5px; margin-left: 4px; }
.mhint.gen { color: var(--warn); }
/* 生成式信息卡 */
.geninfo {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 11.5px; color: var(--text-faint);
}
.geninfo b { color: var(--text-dim); font-weight: 500; }
.fbar {
  height: 3px; background: var(--bg-hover); border-radius: 2px;
  margin-top: 3px; overflow: hidden;
}
.fbar i { display: block; height: 100%; background: var(--ok); }
.fbar i.warn { background: var(--warn); }
.fbar i.bad { background: var(--err); }
/* 示例问句 */
.samples {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px;
}
.samples span { color: var(--text-faint); font-size: 12px; margin-right: 4px; }
.chip {
  background: var(--bg-panel); border: 1px solid var(--border);
  color: var(--text-dim); padding: 4px 10px; border-radius: 3px;
  font-size: 12px; cursor: pointer;
}
.chip:hover { border-color: var(--accent-dim); color: var(--text); }
/* 卡片 */
.card {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: 5px; padding: 16px; margin-bottom: 12px;
}
.card h3 {
  font-size: 12px; color: var(--text-dim); font-weight: 600;
  text-transform: uppercase; letter-spacing: .8px; margin-bottom: 12px;
}
/* ★ M55：板块标题后的小字说明（如「替身信息」后面那句口径说明）。
   中文没有大写概念，但 text-transform/letter-spacing 要还原成正文样式。 */
.card h3 .h3n {
  font-weight: 400; text-transform: none; letter-spacing: 0;
  font-size: 11px; color: var(--text-faint); margin-left: 6px;
}
/* ================================================================
   M17：雷达图 + 图片
   ================================================================ */
.media-block {
  margin-top: 16px; padding-top: 14px;
  border-top: 1px solid var(--border);
}
.media-title {
  font-size: 11px; color: var(--text-dim); letter-spacing: .8px;
  text-transform: uppercase; margin-bottom: 10px;
}
.media-title .cnt, .img-group-t .cnt {
  display: inline-block; margin-left: 6px; padding: 1px 6px;
  border-radius: 3px; background: var(--bg-panel); color: var(--accent);
  font-size: 10px; font-family: var(--mono);
}
.radar-wrap {
  display: flex; justify-content: center; padding: 4px 0 2px;
}
/* 图片网格：按类别分组，缩略图可点开 */
.img-group { margin-bottom: 14px; }
.img-group-t {
  font-size: 12px; color: var(--text); margin-bottom: 8px;
  font-weight: 600;
}
.img-grid {
  display: grid; gap: 10px;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  align-items: start;
}
.shot { margin: 0; }
.shot img {
  /* ★ M19：完整显示，绝不裁切 ★
     之前是 `aspect-ratio:1/1 + object-fit:cover` —— cover 为了填满正方形
     会**裁掉**图片边缘。实测本地 74 张图里 **51 张是竖图**
     （宽高比中位 0.83，最窄 0.37，即 400x1068 的长立绘），
     所以正方形裁切必然把头尾切掉—— 用户反馈"大多图片显示不全"。
     → object-fit: contain（完整显示，留白用面板底色填充）
     → 高度由 JS 按图片真实宽高比设置（见 applyShotHeights），
        这样竖图自然更高、横图更矮，排列整齐又不裁内容。 */
  width: 100%;
  height: 170px;                /* 兜底高度，JS 会按真实比例覆盖 */
  object-fit: contain;
  border: 1px solid var(--border); border-radius: 4px;
  background: var(--bg-page); cursor: zoom-in; display: block;
  transition: border-color .15s ease;
}
.shot img:hover { border-color: var(--accent); }
.shot figcaption {
  margin-top: 4px; font-size: 10px; color: var(--text-dim);
  text-align: center; overflow: hidden; text-overflow: ellipsis;
  white-space: nowrap;
}
.img-note {
  margin-top: 8px; font-size: 10px; color: var(--text-dim); opacity: .8;
}
/* ★ M18：图片后台抓取中的占位 */
.img-wait {
  display: flex; align-items: center; gap: 10px;
  padding: 14px; border: 1px dashed var(--border); border-radius: 4px;
  font-size: 12px; color: var(--text-dim);
}
.spin {
  width: 13px; height: 13px; flex: 0 0 13px;
  border: 2px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  .spin { animation: none; }
}
/* 点击放大的浮层 */
.zoom {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,.88); display: none;
  align-items: center; justify-content: center; cursor: zoom-out;
  padding: 24px;
}
.zoom img {
  max-width: 100%; max-height: 100%;
  border: 1px solid var(--border); border-radius: 4px;
}
/* 路由标记 */
.route {
  display: inline-block; padding: 2px 8px; border-radius: 3px;
  font-size: 11px; font-family: var(--mono); margin-right: 8px;
}
.route.structured { background: #1c3a2e; color: var(--ok); }
.route.semantic  { background: #1e2f4a; color: var(--accent); }
.route.hybrid    { background: #3d2f1a; color: var(--warn); }
.route.abstain   { background: #4a1f1f; color: var(--err); }
/* 答案 */
.answer { font-size: 15px; line-height: 1.75; white-space: pre-wrap; }
/* ★★ M51：结构化答案必须关掉 pre-wrap ★★
   .answer 用 pre-wrap 是为了保留**纯文本**答案里的换行（如 \n\n 空行）；
   但结构化答案是**多行模板字符串**拼出来的 HTML 片段，
   源码里的换行与缩进会被 pre-wrap 原样渲染成真的换行与缩进。
   实测：「类别」那一行的 <dd> 恰好以「换行 + 8 个空格」开头
   （其余 4 行的 <dd> 紧跟标签、没有前导空白），
   所以**只有它**换到下一行、并缩进 8 个空格宽 —— 用户看到的就是这个。 */
.answer.ans-html { white-space: normal; }
.answer-refused { color: var(--warn); }
.meta { color: var(--text-faint); font-size: 12px; margin-top: 10px; }
/* 警告 */
.alert {
  border-left: 3px solid var(--warn); background: #2a2415;
  padding: 9px 13px; border-radius: 0 3px 3px 0; margin-top: 12px;
  font-size: 13px; color: #e8c56a;
}
.alert.err { border-color: var(--err); background: #2a1a1a; color: #f0958f; }
/* 答案类型分发 */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px;
      /* ★ M51 第二道防线：即使外层有 pre-wrap，键值表也不许换行缩进 */
      white-space: normal; }
.kv dt { color: var(--text-faint); }
.kv dd { font-family: var(--mono); font-size: 12px; }
.tag {
  display: inline-block; padding: 1px 7px; border-radius: 2px;
  font-size: 11px; font-family: var(--mono);
  background: var(--bg-hover); color: var(--text-dim);
  margin: 2px 4px 2px 0;
}
/* 证据 */
details.ev { border-top: 1px solid var(--border); padding-top: 10px; margin-top: 10px; }
details.ev summary {
  cursor: pointer; color: var(--text-dim); font-size: 12px;
  list-style: none; user-select: none;
}
details.ev summary::-webkit-details-marker { display: none; }
details.ev summary:before { content: "▸ "; color: var(--text-faint); }
details.ev[open] summary:before { content: "▾ "; }
details.ev summary:hover { color: var(--text); }
.ev-item {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 3px; padding: 10px 12px; margin-top: 8px;
}
.ev-head {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  font-size: 11px; font-family: var(--mono); color: var(--text-faint);
  margin-bottom: 6px;
}
.ev-text { font-size: 12.5px; line-height: 1.65; color: var(--text-dim); }
/* 检索过程 */
/* ★ 默认折叠（M39）：演示时这一块铺开有 6 行，会挤走答案的视线焦点。
   改成 <details> 后只留一行标题，想看细节再点开 —— 信息没丢，只是不抢戏。 */
.proc-fold summary {
  cursor: pointer; font-size: 13px; font-weight: 500;
  color: var(--text-dim); list-style: none; padding: 2px 0;
}
.proc-fold summary::-webkit-details-marker { display: none; }
.proc-fold summary:before { content: "▸ "; color: var(--text-faint); }
.proc-fold[open] summary:before { content: "▾ "; }
.proc-fold summary:hover { color: var(--text); }
.proc-fold[open] summary { margin-bottom: 8px; }
.proc-hint { font-weight: 400; font-size: 11px; color: var(--text-faint); }
.steps { counter-reset: s; }
.step {
  position: relative; padding: 8px 0 8px 32px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.step:last-child { border-bottom: none; }
.step:before {
  counter-increment: s; content: counter(s);
  position: absolute; left: 0; top: 8px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--bg-hover); color: var(--text-dim);
  font-size: 11px; display: flex; align-items: center;
  justify-content: center; font-family: var(--mono);
}
.step .t { color: var(--text); }
.step .d { color: var(--text-faint); font-size: 12px; margin-top: 2px; }
.step.hit:before { background: var(--accent-dim); color: #fff; }
.step.miss:before { background: #3d1f1f; color: var(--err); }
/* 表格 */
table { width: 100%; border-collapse: collapse; font-size: 13px; }
/* ★ M49：内容短的表用 auto —— 不撑满，列宽紧贴内容。
   （六维能力值表：四列各 2 字，撑满时「类别」列 178px 而内容仅 ~22px） */
table.tight { width: auto; }
th, td {
  text-align: left; padding: 7px 11px;
  border-bottom: 1px solid var(--border);
}
th { color: var(--text-faint); font-size: 11px; text-transform: uppercase;
     letter-spacing: .5px; font-weight: 600; }
tr:hover td { background: var(--bg-hover); }
td.num { font-family: var(--mono); font-size: 12px; text-align: right; }
/* 冲突 */
.c-cat { font-family: var(--mono); font-size: 11px; }
.c-cat.UNKNOWN { color: var(--warn); }
.c-cat.INFINITE { color: var(--accent); }
.c-cat.RANKED { color: var(--ok); }
.c-cat.EMPTYSLOT { color: var(--text-faint); }
.c-cat.UNCATEGORIZED { color: var(--text-dim); }

/* ---- M22：冲突消解对照卡 ---- */
/* 深色主题（--bg #14161a），沿用同一套变量 */
.cf-sum {
  font-size: 13px; color: var(--text-dim); margin-bottom: 14px;
  padding: 10px 14px; background: var(--bg-panel);
  border: 1px solid var(--border); border-radius: 8px;
}
.cf-sum b { color: var(--text); }
.cf-card {
  background: var(--bg-panel); border: 1px solid var(--border);
  border-radius: 10px; margin-bottom: 14px; overflow: hidden;
}
/* 保留未知的卡片弱化显示 —— 它是**刻意的决策**，不是失败 */
.cf-card.is-pending { border-color: var(--border); opacity: .82; }
.cf-card.is-pending .cf-head { border-left: 3px solid var(--text-faint); }
.cf-card:not(.is-pending) .cf-head { border-left: 3px solid var(--ok); }

.cf-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  background: var(--bg-hover);
}
.cf-stand { font-weight: 600; font-size: 15px; color: var(--text); }
.cf-dim {
  font-size: 12px; color: var(--accent);
  border: 1px solid var(--accent-dim); border-radius: 4px;
  padding: 1px 7px;
}
.cf-part { font-size: 11px; color: var(--text-faint); }
.cf-state {
  margin-left: auto; font-size: 11px; padding: 2px 9px;
  border-radius: 10px; white-space: nowrap;
}
.cf-state.p { color: var(--text-faint); border: 1px solid var(--border-strong); }
.cf-state.r { color: var(--ok); border: 1px solid var(--ok); }

.cf-srcs { width: 100%; border-collapse: collapse; }
.cf-srcs td {
  padding: 7px 14px; font-size: 12px;
  border-bottom: 1px solid var(--border);
}
.cf-src { color: var(--text-dim); font-family: var(--mono); font-size: 11px; }
.cf-vs { color: var(--text-faint); text-align: center; width: 34px; font-size: 11px; }
.cf-v { font-family: var(--mono); }
/* 纯等级：大号醒目 */
.cf-v.cf-grade { font-size: 16px; font-weight: 700; color: var(--text); }
.cf-v.cf-grade.is-pick { color: var(--accent); }
/* 说明性文本（源A 常见 36 字符的 ?※… 说明）：小字压灰，避免撑破布局 */
.cf-v.cf-text {
  font-size: 11px; color: var(--text-faint);
  display: inline-block; max-width: 260px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  vertical-align: bottom;
}
.cf-v.cf-none { color: var(--text-faint); }

.cf-foot { padding: 10px 14px; }
.cf-line {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  font-size: 12px; margin-bottom: 6px;
}
.cf-line:last-child { margin-bottom: 0; }
.cf-k { color: var(--text-faint); font-size: 11px; }
.cf-tag {
  font-family: var(--mono); font-size: 11px;
  border: 1px solid var(--border-strong); border-radius: 4px;
  padding: 1px 7px; color: var(--text-dim);
}
.cf-reason { color: var(--text-dim); }
.cf-reason span:last-child { flex: 1; min-width: 200px; }
.cf-noreason { color: var(--text-faint); font-style: italic; }

/* 置信度小进度条 */
.cf-conf { display: inline-flex; align-items: center; gap: 6px; }
.cf-conf-bar {
  display: inline-block; width: 66px; height: 5px;
  background: var(--border-strong); border-radius: 3px; overflow: hidden;
}
.cf-conf-bar i { display: block; height: 100%; }
.cf-conf b { font-family: var(--mono); font-size: 11px; color: var(--text-dim); }

/* 敏感性：脆弱 → 警示色；稳健 → 中性 */
.cf-sens { font-size: 11px; }
.cf-sens.ok { color: var(--text-faint); }
.cf-sens.bad { color: var(--warn); }

/* ---- M25：多轮追问（指代消解）提示 ---- */
.coref {
  margin-top: 10px; padding-top: 9px;

/* ---- M32/M36：替身档案卡（与六维雷达并排） ---- */
/* ★ M52：`align-items` 用默认的 stretch —— 让 .sp-info **铺满整行高度**，
   这样里面的六维明细才能「撑到和右边雷达一样高」。
   原来写 flex-start：左栏高度只按内容算，多出来的高度就成了一大片空白。
   ★ M55：它现在是「替身信息」卡片**内部**的行容器（卡片负责外边距） */
.stand-panel { display: flex; gap: 22px; }
/* 左栏改成纵向 flex：档案在上、六维明细在下（flex:1 → 吃掉剩余高度） */
.sp-info { flex: 1 1 auto; min-width: 0;
  display: flex; flex-direction: column; gap: 12px; }
.sp-radar { flex: 0 0 auto; width: 300px; }
/* ★ M52：六维明细网格 —— 3 列 × 2 行，纵向可拉伸填满左栏 */
.zc-dimgrid { flex: 1 1 auto; min-height: 0;
  display: flex; flex-direction: column; gap: 6px;
  margin-left: 15px; }   /* 对齐 .zh-card-inner 的内容（border 3 + padding 12） */
.dg-title { font-size: 11px; color: var(--text-faint); }
.dg-title span { color: var(--text-faint); opacity: .8; }
.dg-cells { flex: 1 1 auto; min-height: 0;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dim-cell { display: flex; flex-direction: column; justify-content: center;
  gap: 3px; padding: 6px 10px; min-height: 46px;
  border: 1px solid var(--border); border-radius: 6px;

.dc-k { font-size: 11px; color: var(--text-faint); }
.dc-v { font-family: var(--mono); font-size: 15px; color: var(--accent); }
.dc-v.zc-na { font-family: inherit; font-size: 11px; font-weight: 400;
  color: var(--text-faint); }
.zh-card-inner { border-left: 3px solid var(--accent); padding-left: 12px; }
/* ★ M55：原 .zc-title「替身档案」已删除 —— 标题提到卡片的 h3「替身信息」上了 */
.zc-row { display: flex; gap: 12px; padding: 4px 0; font-size: 13px; }
.zc-k { flex: 0 0 52px; color: var(--text-faint); font-size: 12px; padding-top: 1px; }
.zc-v { flex: 1; color: var(--text); }
.zc-sub { color: var(--text-dim); font-size: 12px; margin-left: 8px; }
/* ★ M39：译名可信级别徽标（与主译名区分，小而不抢眼） */
.zc-lv { display: inline-block; margin-left: 8px; padding: 0 6px;
  font-size: 11px; line-height: 16px; border-radius: 8px;
  color: var(--text-dim); background: var(--bg-hover); }
/* ★ M39：异译别名行 —— 用户记得的写法可能是这一行里的某个 */
.zc-vars { margin-top: 3px; font-size: 12px; color: var(--text-faint); }
.zc-var { display: inline-block; margin-left: 6px; padding: 0 7px;
  line-height: 17px; border-radius: 8px; font-size: 12px;
  color: var(--text-dim); border: 1px solid var(--border-strong); }
/* ★ M52：原来的「六维」一行（.zc-dims/.zc-dim）已被左侧六维明细网格取代 */
/* ★ M58：形态链（ACT1 → ACT2 …）—— 每段可点，当前段高亮 */
.zc-forms { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.zc-form {
  display: inline-block; padding: 1px 9px; cursor: pointer; font-size: 12px;
  color: var(--text-dim); border: 1px solid var(--border-strong);
  border-radius: 8px;
}
.zc-form:hover { color: var(--text); border-color: var(--accent); }
.zc-form.on {
  color: var(--text); border-color: var(--accent);
  background: var(--accent-dim); cursor: default;
}
/* ============ M65：地点卡 ============
   ★ 只加样式，不改既有类 —— 地点卡复用 .zc-row/.zc-k/.zc-v/.tag，
     保证两张卡在视觉上是一套东西（用户不必重新学怎么读）。 */
.lc-na { color: var(--text-faint); font-style: italic; }
.lc-path { display: inline-block; margin: 1px 0; }
.lc-arr { color: var(--text-faint); padding: 0 2px; }
.lc-line { margin: 3px 0 8px; font-size: 13px; color: var(--text-dim);
  line-height: 1.7; }
.lc-note { margin-top: 10px; padding: 8px 10px; font-size: 12px;

  border-radius: 6px; }
.lc-weak { margin-top: 8px; }
/* 关联标签可点（点开看语料原文），所以要有可点的样子 */
.tag.lc-rel { cursor: pointer; }
.tag.lc-rel:hover { color: var(--text); border-color: var(--accent); }
.lc-p { color: var(--text-faint); font-size: 10px; margin-left: 4px; }
.lc-ev { margin-top: 6px; border-left: 3px solid var(--warn);

.lc-ev-h { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.lc-ev-b { font-size: 12.5px; line-height: 1.7; color: var(--text);
  white-space: pre-wrap; word-break: break-word; }
/* ============ M66：角色卡 ============ */
.cc-link { cursor: pointer; border-bottom: 1px dashed var(--border-strong); }
.cc-link:hover { color: var(--text); border-bottom-color: var(--accent); }
.cc-note { margin-top: 2px; font-size: 11.5px; color: var(--text-faint); }
.cc-facts { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
.cc-fact { font-size: 12.5px; }
.cc-fk { color: var(--text-faint); margin-right: 6px; }
.cc-fv { color: var(--text); }
/* 三段原文（简介/背景/性格）：默认收起，展开看源站英文 */
.cc-fold { margin-top: 6px; border-top: 1px solid var(--border); padding-top: 6px; }

.cc-src { margin-left: 8px; font-size: 11px; color: var(--text-faint); }

.cc-bio { font-size: 13px; line-height: 1.8; color: var(--text); margin-top: 4px; }
.zc-form.no-link { cursor: default; opacity: .65; }

  .dg-cells { grid-template-columns: repeat(2, 1fr); }

  border-top: 1px dashed var(--border-strong); font-size: 11px; }

/* ---- M38：条件值提示 ---- */
.caveat {
  margin-top: 12px; padding: 10px 12px; border-radius: 8px;
  background: var(--bg-panel); border-left: 3px solid var(--warn);
  font-size: 12px; line-height: 1.7; color: var(--text);
}
.caveat b { font-weight: 500; color: var(--warn); }
.cv-body { margin-top: 2px; }
.caveat b + .cv-body { margin-top: 4px; }
.cv-src { margin-top: 6px; font-size: 11px; color: var(--text-faint); }
.cv-src code {
  font-family: var(--mono); font-size: 11px; color: var(--text-dim);
  background: var(--bg); padding: 1px 5px; border-radius: 3px;
}
.cv-others {
  margin-top: 10px; padding-top: 8px; font-size: 11px;
  color: var(--text-faint); border-top: 1px dashed var(--border-strong);
}

.cv-other b { color: var(--warn); font-weight: 500; }
.cv-src-inline {
  font-family: var(--mono); font-size: 10px; color: var(--text-faint);
  margin-left: 6px;
}
.tag.c-cond { border-color: var(--warn); color: var(--warn); cursor: help; }
/* ★ M54：∞（无限）的条目 —— 与主色一致，区别于「有等级」的条目 */
.tag.c-inf { border-color: var(--accent); color: var(--accent); cursor: help; }

.ok { color: var(--ok); } .bad { color: var(--err); }
.empty { color: var(--text-faint); font-size: 13px; padding: 22px; text-align: center; }
.loading { color: var(--text-dim); font-size: 13px; padding: 18px; }
</style>
</head>
<body>

<!-- ★★ M54：顶部 header 改成**左侧导航栏** ★★
     用户要求：「帮我做个左侧导航栏」。
     原来的横条 nav 会随内容滚动走（position:sticky 但占满整行宽度），
     改成侧栏后导航常驻在左、内容区在右，且状态灯/规模数字有了固定位置。
     ★ #dot / #dotTxt 的 id 必须保留 —— ping() 靠它们更新服务状态。 -->
<div class="app">
<!-- ★★ M57：把 M54 的「全局侧栏」改回**顶栏** ★★
     用户原话：「我不是让你把这个改回去吗 我要的导航栏是搜索结果出来后
     能够导航到各个部分 如答案 替身资料 检索过程 图片」。
     → 我把「左侧导航栏」理解成了全局导航（问答/数据浏览/…），
       而他要的是**结果页内的板块导航**。
     → 全局导航回到顶栏（M54 之前的样子），左侧留给结果页索引（见 .res-toc）。
     ★ #dot / #dotTxt / #sideStat / #webBuild / #verWarn 的 id 必须保留 ——
       ping() 与 checkWebBuild() 靠它们更新。 -->
<header>
  <div class="brand">
    <div class="brand-name">fictional-lore-rag</div>
    <div class="brand-sub">替身数据混合检索问答</div>
  </div>
  <span id="dot" title="服务状态">●</span><span id="dotTxt">连接中</span>
  <div class="head-meta">
    <!-- ★★ M56：网页构建号（服务端注入 index.html 的修改时间）★★
         用途：用户反复说「网页还是没区别」，而服务端明明是新版 ——
         光靠"强刷新"这句话解决不了。这里直接印出来 + 自动比对：
           · 显示具体时间且与服务器一致 → 看到的就是最新页面
           · 显示「未知」  → 服务是旧进程（不会做替换）→ 重启 start.bat
           · 与服务器不一致 → 浏览器缓存了旧页面 → 顶部会自动提示
         ★ 注意：占位符在整份 HTML 里**只允许出现一次**（就是这个 <b> 里）。
           不要把它写进注释或 JS 字面量 —— 服务端是"全局文本替换"，
           会把那些地方一起改写掉。实测踩坑：JS 里原本写的是
           `mine === '<占位符>'`，被替换成了 `mine === '<构建号>'`，
           于是「正确的构建号」反而被判成「没被替换」→ 页面自己误报旧版本。 -->
    <span id="sideStat" class="side-stat"></span>
    <span class="side-ver">网页版本 <b id="webBuild">__WEB_BUILD__</b></span>
    <span id="verWarn" class="side-warn" hidden></span>
  </div>
  <nav>
    <button class="on" data-v="q">问答</button>
    <button data-v="b">数据浏览</button>
    <button data-v="c">冲突记录</button>
    <button data-v="s">系统状态</button>
  </nav>
</header>

<div class="wrap">

<!-- ══════════ 问答 ══════════ -->
<div class="view on" id="v-q">
  <div class="qbox">
    <input type="text" id="qi" placeholder="问一个问题，例如：Star Platinum 的破坏力是几级？"
           autocomplete="off">
    <button class="go" id="qb">查询</button>
    <button id="newChat" title="清空上下文，下次追问不再引用上一轮对象">新对话</button>
  </div>
  <!-- ★ M11：抽取式 / 生成式 对比 -->
  <div class="modes">
    <span class="mlabel">回答方式</span>
    <button class="mbtn on" id="mExtract"
            title="返回数据源原文片段。零生成、零幻觉、秒级响应">抽取式</button>
    <button class="mbtn" id="mGenerate"
            title="Qwen2.5-1.5B 生成。带忠实度约束，但慢约 5 秒">生成式</button>
    <span class="mhint" id="mHint">返回原文片段，不生成任何内容</span>
  </div>
  <div class="samples">
    <span>试试：</span>
  </div>

  <!-- ★★ M57：结果区 = 左侧**板块索引** + 右侧正文 ★★
       用户要的导航栏就是这个：搜索出结果后能跳到各板块
       （答案 / 替身资料 / 检索过程 / 图片）。
       ★ 索引项由 buildResToc() **按实际渲染出的板块**生成 ——
         排名类问题只有「答案」一块，就不会出现点了跳不过去的死链。
       ★ 原来的「检索过程」是这里的静态折叠块，现已移入 #ans 成为
         一个正式板块（有 data-sec，可被索引到）。 -->
  <div class="result">
    <aside class="res-toc" id="resToc" hidden>
      <div class="rt-title">本页内容</div>
    </aside>
    <div class="res-main" id="resMain">
      <div id="rout"></div>
      <!-- 答案 / 替身资料 / 检索过程 / 图片 / 相似替身 都由 JS 渲染进 #ans -->
      <div id="ans"></div>
    </div>
  </div>
</div>

<!-- ══════════ 数据浏览 ══════════ -->
<div class="view" id="v-b">
  <div class="qbox">
    <input type="text" id="bi" placeholder="输入替身名或 stand_id，如：Star Platinum / star_platinum"
           autocomplete="off">
    <button class="go" id="bb">查询</button>
  </div>
  <div class="samples" id="bSamples"><span>试试：</span></div>
  <div id="bans"></div>
</div>

<!-- ══════════ 冲突 ══════════ -->
<div class="view" id="v-c">
  <div style="margin-bottom:14px">
    <button class="chip" onclick="loadC('all')">全部</button>
    <button class="chip" onclick="loadC('pending')">待消解</button>
    <button class="chip" onclick="loadC('resolved')">已消解</button>
  </div>
  <div id="cans" class="loading">加载中…</div>
</div>

<!-- ══════════ 状态 ══════════ -->
<div class="view" id="v-s">
  <div id="sans" class="loading">加载中…</div>
</div>

</div>

<script>
const API = location.origin;
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SAMPLES = [
  'Star Platinum 的破坏力是几级？',
  '所有替身中，破坏力最高的是哪个？',
  'Made in Heaven 的速度是多少？',
  'Tusk 的射程是多少？',
  '使用者 Giorno Giovanna 有哪些替身？',
  'Anubis 的外观形态方面有哪些描述？',
  // ★ M65：地点是新维度，示例里必须有一个 —— 否则用户不知道能这么问
  '安杰罗岩是什么地方',
  'Star Platinum Ultimate 的能力值是多少？'
];
$('.samples').insertAdjacentHTML('beforeend',
  SAMPLES.map(q=>`<span class="chip" onclick="ask('${esc(q)}')">${esc(q)}</span>`).join(''));
$('#bSamples').insertAdjacentHTML('beforeend',
  ['Star Platinum','The World','Made in Heaven','Tusk','Anubis']
    .map(n=>`<span class="chip" onclick="askB('${esc(n)}')">${esc(n)}</span>`).join(''));

// ★★ M22 修 bug：数据浏览的「查询」按钮**从未绑定任何事件** ★★
//   askB() 本身是支持读输入框的（n 缺省时取 $('#bi').value），
//   但 #bb 上没有 onclick / addEventListener →
//   用户手动输入替身名后点「查询」**毫无反应**，
//   只有点下面那几个示例 chip 才能查。
//   ★ 这是「接口全绿但前端不能用」的典型：脚本一测就发现，
//     纯接口测试永远发现不了。
$('#bb').onclick = () => askB();
$('#bi').addEventListener('keydown', e => {
  if(e.key === 'Enter') askB();
});

// ★ M25：同一个教训 —— 新加的按钮必须绑事件
$('#newChat').onclick = () => resetSession();
// ★ M60：这里原来又给 #qi 绑了一次回车 —— 加上 M18 那次和下面的 onkeydown，
//   **同一个输入框上叠了 3 个 Enter 监听**，按一次回车会连发 3 个相同请求。
//   实测（test_gui_e2e 抓包）：一次回车 → 3 条 POST /query。
//   后果：① 白白多打两倍后端算力；② 三个响应竞速渲染，
//   最后落地的那一个可能不是用户看到的中间态；③ 语料/图片接口被重复触发。
//   → 只保留 M18 那处（含 preventDefault，唯一且正确）。
//   绑定统一放在下面的 M18 段里，新增监听前先搜一下有没有绑过。

// ---------- 模式切换（M11）----------
let MODE = 'extract';
const HINTS = {
  extract: '返回原文片段，不生成任何内容',
  generate: 'Qwen2.5-1.5B 生成 · 忠实度约束 · 约 5 秒',
};
$('#mExtract').onclick = () => setMode('extract');
$('#mGenerate').onclick = () => setMode('generate');

// ★★★ M18修一个静默失效的 bug ★★★
//   查询按钮 #qb 与输入框回车**从未绑定事件** —— 只有下面的示例 chip
//   用了 inline onclick="ask(...)"，所以点示例能查、手打输入却毫无反应
//   （实测：填好问句点「查询」，页面连"检索中…"都不显示，
//     因为根本没发请求。用户会以为服务挂了。）
$('#qb').onclick = () => ask();
$('#qi').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); ask(); }
});

function setMode(m){
  MODE = m;
  $('#mExtract').classList.toggle('on', m==='extract');
  $('#mGenerate').classList.toggle('on', m==='generate');
  const h = $('#mHint');
  h.textContent = HINTS[m];
  h.classList.toggle('gen', m==='generate');
}

// ---------- ★ M56：页面自检「我是不是旧页面」----------
//   用户反复反馈「网页还是没区别」，而服务端 `curl /` 明明是新版 ——
//   原因只可能是两类，但**从界面上看不出来**：
//     ① 浏览器缓存了旧页面（连 F5 都不回来验证）
//     ② 打开的不是这个服务（旧进程 / 别的端口）
//   → 把构建号印在侧栏，并拿服务器返回的构建号自动比对；
//     不一致就直接把"该怎么办"写在页面上，不用再猜。
function checkWebBuild(serverBuild){
  const el = $('#webBuild'), warn = $('#verWarn');
  if(!el || !warn) return;
  const mine = el.textContent.trim();
  // ★★ 不要用「mine === 占位符字面量」来判断"没被替换" ★★
  //   服务端是**全局文本替换**，写成字面量会被一起改写掉：
  //   实测踩坑 —— 那个比较式里的字面量被换成了构建号本身，
  //   于是**正确的构建号反而被判成占位符**，页面自己误报"旧版本"。
  //   → 改成判断"像不像构建号"（格式校验），就不再依赖会被改写的字面量。
  const looksLikeStamp = /^\d{2}-\d{2} \d{2}:\d{2}$/.test(mine);
  let msg = '';
  if(!looksLikeStamp){
    // 占位符没被替换 → 服务端是**旧进程**（旧代码不做这个替换）
    el.textContent = '未知';
    msg = '服务是旧进程（不会注入构建号）→ 请关掉黑窗口，重新双击 start.bat';
  }else if(serverBuild && serverBuild !== mine){
    msg = `你看到的是缓存的旧页面（页面 ${mine} · 服务器 ${serverBuild}）`
        + ` → 按 Ctrl+Shift+R，或在网址后面加 ?v=2 再回车`;
  }
  warn.hidden = !msg;
  warn.textContent = msg;
}

// ---------- 服务状态灯 ----------
// ★ 教训：界面本身能打开不代表服务活着 —— 静态 HTML 是本地文件，
//   API 才需要后端。加个探活，用户不用靠「查询失败」才发现服务挂了。
async function ping(){
  const dot=$('#dot'), txt=$('#dotTxt');
  // ★ M54：侧栏底部再显示一行规模数字（替身数 / 语料块数）
  const st=$('#sideStat');
  try{
    const r = await fetch(API+'/health', {cache:'no-store'});
    const d = await r.json();
    // ★ M12：把索引配置显示出来 ——
    //   换索引会直接改变检索质量，用户必须能一眼看出当前用的哪套，
    //   否则「结果变好了 / 变差了」都无从归因。
    const idx = (d.chunk_merge_target
      ? `合并${d.chunk_merge_target}`
      : `原始${d.n_chunks||'?'}`);
    if(d.status==='ok'){
      dot.className='ok'; dot.title='服务正常';
      txt.textContent = `已连接 · ${d.vector_enabled?'混合检索':'BM25'} · ${idx}`;
    }else{
      dot.className='wait'; dot.title='数据库降级中';
      txt.textContent=`已连接·降级 · ${idx}`;
    }
    if(st) st.textContent =
      `替身 ${d.n_stands ?? '?'} · 语料 ${d.n_chunks ?? '?'} 块`;
    // ★ M56：拿服务器返回的构建号跟本页自带的比对（见 checkWebBuild）
    checkWebBuild(d.web_build);
  }catch(e){
    dot.className='bad'; dot.title='服务未启动';
    txt.textContent='服务未启动';
    if(st) st.textContent='';
  }
}
// ★ M56：先做一次**不依赖网络**的自检 ——
//   如果构建号还是占位符，说明服务端是旧进程（旧代码不做替换），
//   这种情况连 /health 都可能拿不到新字段，所以要在这里先报出来。
checkWebBuild(null);
ping();

// ---------- M25：多轮会话 ----------
// ★ 会话 id 存 localStorage：刷新页面后上下文还在（符合用户直觉）。
//   点「新对话」换一个 id，等价于清空上下文。
function newSessionId(){
  return 's-' + Date.now().toString(36) + '-' +
         Math.random().toString(36).slice(2, 8);
}
let SID = localStorage.getItem('ragkb_sid');
if(!SID){ SID = newSessionId(); localStorage.setItem('ragkb_sid', SID); }

function resetSession(){
