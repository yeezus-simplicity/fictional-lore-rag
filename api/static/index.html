}

async function ask(q){
  q = (q!==undefined? q : $('#qi').value).trim();
  if(!q) return;
  $('#qb').disabled = true;
  $('#rout').innerHTML = '<div class="card"><div class="loading">检索中…</div></div>';
  $('#ans').innerHTML = '';
  // ★ M57：#procCard 现在在 #ans 里面，上一步已把它清掉 → 判空再动
  const _pc0 = $('#procCard');
  if(_pc0) _pc0.style.display = 'none';
  try{
    // ★ /query 的参数是 **query string**（q / top_k），不是 JSON body
    //   实测踩坑：按 body 传 {question:...} → 422 Unprocessable Content
    const r = await fetch(`${API}/query?` +
      new URLSearchParams({q:q, top_k:'3', mode:MODE, session_id:SID}),
      {method:'POST'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    render(await r.json());
    ping();                    // 顺带刷新状态灯
  }catch(e){
    // ★★ M58b：区分「连不上」与「服务报错」★★
    //   实测教训：我把 **HTTP 500**（服务端内部错误）也写成
    //   「无法连接到服务 / 最可能的原因：API 服务已停止」——
    //   而服务明明活着，用户被这句话带去查"服务是不是挂了"，方向完全错。
    //   → 只有 fetch 本身失败（网络层）才提示"连不上"；
    //     5xx 提示"服务内部错误"，4xx 提示"请求被拒绝"。
    const _m = String((e && e.message) || e);
    const _st = (() => { const x = _m.match(/HTTP\s+(\d{3})/); return x ? +x[1] : 0; })();
    const _net = !_st && /fetch|network|load|timeout/i.test(_m);
    const head = _net ? '无法连接到服务' : (_st >= 500 ? '服务内部错误' : '请求未被接受');
    const why = _net
      ? `最可能的原因：<b>API 服务没在运行</b>。它在独立进程里，
         关掉那个窗口或进程被回收后就查不了。`
      : (_st >= 500
        ? `<b>服务还活着</b>，但处理这次请求时内部出错（HTTP ${_st}）。
           多半是这条问句触发了某个分支的缺陷 —— 换个说法通常能绕过。`
        : `服务收到了请求但拒绝了它（HTTP ${_st}），请检查问法或参数。`);
    $('#rout').innerHTML = `
      <div class="card">
        <h3>${head}</h3>
        <div class="alert err">
          ${esc(_m)}
          <div style="margin-top:10px">${why}</div>
        </div>
        ${_net ? `<div class="meta" style="margin-top:12px">
          重新启动：在<b>项目根目录</b>执行 <code>python start.py</code><br>
          或 <code>python api/main.py --no-vector</code><br>
          再打开 <code>http://127.0.0.1:8765</code>
        </div>` : ''}
        <div class="meta" style="margin-top:8px">
          当前页面地址：<code>${esc(location.href)}</code><br>
          界面请求的地址：<code>${esc(location.origin)}</code>
          ${location.port==='8765' ? '' : '<br>★ 端口不是 8765 —— 请用服务实际输出的端口地址'}
        </div>
      </div>`;
  }
  $('#qb').disabled = false;
}

function render(d){
  // 路由卡
  // ★ M25：指代消解提示 —— 只有在**真的发生了替换**时才显示，
  //   让用户看得见系统把「它」理解成了谁（不然追问出错时无从判断）
  const cf = d.coref;
  const cfHtml = cf ? `
      <div class="coref">
        <span class="cf-pron">「${esc(cf.pronoun)}」</span>
        <span class="cf-arrow">→</span>
        <span class="cf-target">${esc(cf.resolved_to)}</span>
        <span class="cf-from">承接上一轮「${esc(cf.from_question||'')}」</span>
      </div>` : '';
  $('#rout').innerHTML = `
    <div class="card">
      <span class="route ${esc(d.route)}">${esc(d.route)}</span>
      <span class="meta" style="display:inline">${esc(d.route_reason)}</span>
      <div class="meta">${d.elapsed_ms.toFixed(0)} ms · 答案类型 ${esc(d.answer_type)}
        ${d.confidence!=null? ' · 置信度 '+d.confidence : ''}</div>
      ${cfHtml}
    </div>`;
  // ★ M57：**先渲染答案、再填检索过程** —— 答案渲染会生成 #proc / #procCard，
  //   顺序反了的话 renderProcess 会往一个还不存在的节点里写（静默失效）
  renderAnswer(d);
  renderProcess(d);
}

function renderProcess(d){
  const steps = [];
  steps.push({cls:'', t:'路由判定',
    d:`识别为 <b>${esc(d.route)}</b> —— ${esc(d.route_reason)}`});
  // ★ M25：把消解过程也放进「处理过程」，可追溯
  if(d.coref){
    steps.push({cls:'hit', t:'指代消解',
      d:`「${esc(d.coref.pronoun)}」→ <b>${esc(d.coref.resolved_to)}</b>`
        + (d.coref.from_question
           ? `（来自上一轮「${esc(d.coref.from_question)}」）` : '')});
  }
  const ev = d.evidence||[];
  if(d.retrieval_meta){
    const rm = d.retrieval_meta;
    if(rm.retrieval) steps.push({cls:'', t:'检索',
      d:`${esc(rm.retrieval)}${rm.rrf_k?'（RRF k='+rm.rrf_k+'）':''}`});
  }
  ev.forEach((e,i)=>{
    steps.push({cls:'hit', t:`证据 ${i+1}`,
      d:`${esc(e.type)}`
        + (e.stand_name? ` · ${esc(e.stand_name)}`:'')
        + (e.chunk_type? ` · ${esc(e.chunk_type)}`:'')
        + (e.chunk_id!=null? ` · #${e.chunk_id}`:'')
        + (e.table? ` · 表 ${esc(e.table)}`:'')
        + (e.field? ` · 字段 ${esc(e.field)}`:'')});
  });
  if(!ev.length) steps.push({cls:'miss', t:'无证据', d:'未检索到相关片段'});
  steps.push({cls:'', t:'生成/组织',
    d: d.answer_type==='snippet'? '抽取式：直接返回原文片段（零生成）'
      : '抽取式：结构化查询直接返回字段值（零生成）'});
  $('#proc').innerHTML = steps.map(s=>
    `<div class="step ${s.cls}"><div class="t">${s.t}</div><div class="d">${s.d}</div></div>`
  ).join('');
  // ★ M39：每轮新查询都强制收起。
  //   否则用户展开过一次后，后续所有查询都会是展开态 ——
  //   折叠就白做了（演示时仍然每屏都铺着 6 行）。
  //   ★ M57：判空 —— 它在 #ans 里，理论上一定存在，但别让 null 打断整条渲染
  const _pc = $('#procCard');
  if(_pc){ _pc.open = false; _pc.style.display = ''; }
}

// ★★ M32：中文摘要卡 ★★
//   用户反馈「答案返回一堆英文介绍看不懂」。
//   根因：语料全部来自 jojowiki 英文站（2407/2407 块都是英文）。
//   ★ 处理方式刻意**不用机器翻译** —— 那会破坏「证据可追溯」这个
//     项目的立身之本。改用**本来就有中文的数据**拼一张卡：
//     中文名 / 日文原名 / 使用者 / 登场部数 / 六维中文等级 / 类型。
//   英文原文仍然保留（下面折叠展示），中文只是「看得懂的第一层」。
function renderZhCard(zc, forms){
  if(!zc) return '';
  const names = [zc.name_en, zc.name_ja].filter(Boolean);
  const rows = [];
  // ★★ M39：可信级别与出处 ★★
  //   A=jojowiki 官方 / B=两来源一致 / C=单一来源 / D=由形态名反推
  //   ★ 标出来是为了让用户能分辨「这条译名有没有据可查」，
  //     而不是让所有中文名看起来同等权威（反馈「感觉像机翻」的根源之一）。
  const LV = {A:'官方译名', B:'双来源一致', C:'单一来源', D:'由形态名反推'};
  const lvTxt = LV[zc.name_zh_level] || '';
  // ★★ M39：异译别名 ★★
  //   同一个替身流传多个译名（Baby Face = 婴儿面孔 / 娃娃脸），
  //   用户往往记得的是**非主译名**那个。
  //   不显示的话，输入「娃娃脸」却看到「婴儿面孔」，会以为翻错了。
  const vars = (zc.name_zh_variants||[]).filter(Boolean);
  rows.push(`<div class="zc-row"><span class="zc-k">名称</span>
    <span class="zc-v"><b>${esc(zc.name_zh||zc.name_en||'—')}</b>
    ${names.length? `<span class="zc-sub">${esc(names.join(' · '))}</span>`:''}
    ${lvTxt? `<span class="zc-lv" title="译名可信级别">${esc(lvTxt)}</span>`:''}
    ${vars.length? `<div class="zc-vars">其他译名：${vars.map(v=>`<span class="zc-var">${esc(v)}</span>`).join('')}</div>`:''}
    </span></div>`);
  if(zc.owner) rows.push(`<div class="zc-row"><span class="zc-k">使用者</span>
    <span class="zc-v"><span class="cc-link" role="button" tabindex="0"
      data-ask="${esc(zc.owner + ' 是谁')}"
      title="查看该角色的档案（背景 / 性格 / 经历）">${esc(zc.owner)}</span>
    ${zc.owner_en? `<span class="zc-sub">${esc(zc.owner_en)}</span>`:''}</span></div>`);
  if(zc.part) rows.push(`<div class="zc-row"><span class="zc-k">登场</span>
    <span class="zc-v">第 ${esc(String(zc.part))} 部</span></div>`);
  if(zc.type) rows.push(`<div class="zc-row"><span class="zc-k">类型</span>
    <span class="zc-v">${esc(zc.type)}</span></div>`);
  // ★★ M52：六维从「一行挤 6 个」改为 **3×2 六格明细** ★★
  //   为什么：右侧雷达 375px 高，而左侧文字只有 174px
  //   → 左栏下方留出 **201px 空白（占右栏 54%）**，用户反馈「左边一大边空白」。
  //   ★ 用户明确说不缩雷达 —— 所以反过来：**让左栏有足够的内容**。
  //   这一块和雷达是**同一份数据**的两种表示（图 + 明细），
  //   并且能表达雷达给不出的信息（「无数据」是一个明确状态，不是 0）。
  let dimGrid = '';
  const dims = Object.entries(zc.stats_cn || {});
  if(dims.length){
    const cells = dims.map(([k,v])=>
      `<div class="dim-cell"><span class="dc-k">${esc(k)}</span>
        <b class="dc-v${v?'':' zc-na'}">${v?esc(v):'无数据'}</b></div>`).join('');
    // ★ M58：形态组母体本身不单列六维（数据记在各形态上）→ 必须明说，
    //   否则六格「全部无数据」会被读成"这个替身什么都不知道"
    //   （实测 Tusk / Echoes 的母体就是这种情况）。
    const _noOwnDims = forms && forms.length > 1 && zc.stats_cn
      && Object.values(zc.stats_cn).every(v => !v);
    const _dimNote = _noOwnDims
      ? '本替身是形态组，六维记在各形态上 → 点上面的形态查看'
      : '与右图同源；E~A 为等级，无数据 = 原站未给出，不是 0';
    dimGrid = `<div class="zc-dimgrid">
        <div class="dg-title">六维明细
          <span>${esc(_dimNote)}</span></div>
        <div class="dg-cells">${cells}</div>
      </div>`;
  }
  // ★★ M58：形态链（ACT1 → ACT2 → …），每段可点 ★★
  //   用户反馈：「tusk 和 echo 这两个替身是有不同阶段的 但是搜索结果只有一种」。
  //   实测：形态链一直存在于 stand_forms 表，但前端**从来没读过**；
  //   而母体在 stands.json 里缺失（只有派生形态），于是整条链都在界面上隐身。
  //   → 现在把 API 返回的 forms 画出来，并标出"当前处于哪一段"。
  if(forms && forms.length > 1){
    const chain = forms.map(f =>
      `<span class="zc-form${f.current ? ' on' : ''}${f.stand_id ? '' : ' no-link'}"
        ${f.stand_id ? `onclick="ask('${esc(f.label)} 的六维能力')"`
                     + ` title="查看该形态的六维"` : ' title="该形态未独立收录"'}
        >${esc(f.name)}</span>`).join(
      '<span class="zc-form-arrow">→</span>');
    rows.push(`<div class="zc-row"><span class="zc-k">形态</span>
      <span class="zc-v zc-forms">${chain}</span></div>`);
  }
  return `<div class="zh-card-inner">
    ${rows.join('')}
  </div>${dimGrid}`;
}

// ★★ M65：地点档案卡（安杰罗岩 / 杜王町 / 恶魔掌心 这类）★★
//   三条设计原则（都是本项目的既有硬规则，不是新发明）：
//     ① **只显示强证据**：关联的替身/角色必须是「该地点条目正文里写到过谁」。
//        弱证据（实体页提到该地名）只给数量 —— 泛地名会爆炸
//        （实测 Morioh 173 条 / Egypt 151 条），全列出来等于没信息。
//     ② **源站没填的字段照实写「源站未提供」**，不填 0、不猜。
//        地点 Infobox 的 residents 实测只有 2% 填充率，界面不能显示成「无居住者」。
//     ③ 归属层级用 `→` 串起来，且**允许一条地点有多条路径**
//        （源站用换行表示「并列的第二处归属」，不是同一条路径的分隔）。
// ★★ 地点卡关联证据的存放处 ★★
//   为什么不把 JSON 直接内联进 onclick（我第一版就是这么写的，实测失效）：
//     onclick="showLocEvidence(${JSON.stringify(x)})"
//   → JSON 里的**双引号会提前闭合 HTML 属性** → onclick 变成
//     `showLocEvidence({` 这种半截代码 → 点标签**毫无反应**
//     （不报错、不跳转，最难查的那一类）。
//   ★ 既有的 ask('...') 之所以没事，是因为它用的是**单引号属性**；
//     但内容里一旦出现撇号（英文原文很常见）同样会坏 → 所以统一改成
//     **按索引引用**，HTML 里只放一个数字，彻底绕开引号问题。
let LOC_EV = [];

// 点地点关联标签 → 展示该条证据的原文片段（证据可追溯，不是"我说的"）
function showLocEvidence(i){
  const box = document.getElementById('locEv');
  const x = LOC_EV[i];
  if(!box || !x) return;
  box.innerHTML = `<div class="lc-ev">
    <div class="lc-ev-h">原文证据 · 语料块 #${esc(String(x.chunk_id))}
      （命中「${esc(x.matched_term||'')}」）</div>
    <div class="lc-ev-b">${esc(x.snippet||'（无片段）')}</div>
  </div>`;
  box.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function renderLocationPanel(d){
  LOC_EV = [];                 // 每次重渲染都重置（索引与下面的 push 一一对应）
  const lc = d.location_card;
  if(!lc) return '';
  const rows = [];
  const sub = [lc.name_en, lc.name_ja, lc.name_romaji].filter(Boolean);
  rows.push(`<div class="zc-row"><span class="zc-k">名称</span>
    <span class="zc-v"><b>${esc(lc.name_zh || lc.name_en || '—')}</b>
    ${sub.length? `<span class="zc-sub">${esc(sub.join(' · '))}</span>`:''}
    ${lc.name_zh_source? `<span class="zc-lv" title="中文名来源：${esc(lc.name_zh_evidence||'')}">${
      lc.name_zh_source==='manual' ? '人工确认' :
      lc.name_zh_source==='generic_zh' ? '通行译名' : '萌娘条目'}</span>`:''}
    </span></div>`);
  rows.push(`<div class="zc-row"><span class="zc-k">类型</span>
    <span class="zc-v">${(lc.types||[]).length
      ? (lc.types||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')
      : '<span class="lc-na">源站未提供</span>'}</span></div>`);
  rows.push(`<div class="zc-row"><span class="zc-k">登场</span>
    <span class="zc-v">${lc.part? `第 ${esc(String(lc.part))} 部` :
      '<span class="lc-na">源站未提供</span>'}</span></div>`);
  // ★ 归属路径：源站 place 字段原文的层级（可多条 —— 见上方原则③）
  const paths = (lc.place_paths||[]).filter(p=>p && p.length);
  rows.push(`<div class="zc-row"><span class="zc-k">归属</span>
    <span class="zc-v">${paths.length
      ? paths.map(p=>`<span class="lc-path">${p.map(esc).join(' <span class="lc-arr">→</span> ')}</span>`).join('<br>')
      : '<span class="lc-na">源站未提供</span>'}</span></div>`);
  // ★ 首次出场：漫画 / 动画分开写，多值不合并（Cairo 有 Chapter 117 与 122 两次）
  const md = lc.mangadebuts||[], ad = lc.animedebuts||[];
  if(md.length || ad.length){
    rows.push(`<div class="zc-row"><span class="zc-k">首次出场</span>
      <span class="zc-v">${md.length? `漫画：${md.map(esc).join('、')}` : ''}
      ${ad.length? `${md.length?'　':''}动画：${ad.map(esc).join('、')}` : ''}</span></div>`);
  }
  // ★ 强证据：该地点条目正文里写到的替身/角色（每条都能点开看原文块）
  const tagOf = (x, kind) => {
    const i = LOC_EV.push(x) - 1;        // ★ 只把**索引**放进 HTML（见上方说明）
    return `<span class="tag lc-rel" role="button" tabindex="0"
      title="${esc(x.name_en||'')}${x.name_en?' · ':''}证据：语料第 ${esc(String(x.chunk_id))} 块命中「${esc(x.matched_term||'')}」"
      onclick="showLocEvidence(${i})">${esc(x.name)}</span>`;
  };
  if((lc.stands||[]).length){
    rows.push(`<div class="zc-row"><span class="zc-k">相关替身</span>
      <span class="zc-v">${lc.stands.map(x=>tagOf(x,'stand')).join('')}</span></div>`);
  }
  if((lc.characters||[]).length){
    rows.push(`<div class="zc-row"><span class="zc-k">相关角色</span>
      <span class="zc-v">${lc.characters.map(x=>tagOf(x,'character')).join('')}</span></div>`);
  }
  // ★ 弱证据只给数量并说明口径 —— 不混进上面的列表
  const weak = lc.weak_count||0;
  const weakNote = `<div class="lc-note">关联口径：上面列的是
    <b>该地点条目正文里写到过</b>的替身/角色（强证据，点标签可看原文）。
    ${weak? `另有 <b>${weak}</b> 条是这些条目里提到过本地名（弱证据）——
      泛地名时会很多（如 Morioh 173 条），故不展开。` : ''}
    ${(lc.missing||[]).length? `<br>源站未提供：${esc((lc.missing||[]).join('、'))}
      —— 按原样留空，<b>不填 0</b>。` : ''}</div>`;
  return `<div class="card" data-sec="sec-loc" data-secname="地点资料">
    <h3>地点资料 <span class="h3n">数据来自 jojowiki 的地点条目 · 可用中文名/英文名/日文名提问</span></h3>
    <div class="zh-card-inner">${rows.join('')}</div>
    <div class="lc-weak"><span id="locEv"></span></div>
    ${weakNote}
  </div>`;
}

// ★★ M66：角色档案卡（人物背景）★★
//   用户最初的诉求就是「补一下人物的背景」。
//   三条原则（与地点卡一致）：
//     ① 简介/背景/性格是**源站英文原文**，不机翻 —— 中文只给结构化事实；
//        想看原文点一下展开（证据可追溯）。
//     ② 源站没填的字段照实写「源站未提供」，不填 0、不猜。
//     ③ 部数优先用 DB 值；与"首次出场推断"不一致时**把差异写出来**
//        （如承太郎：第 2 部末客串、主要登场第 3 部），不静默丢弃。
function renderCharacterPanel(d){
  const c = d.character_card;
  if(!c) return '';
  const rows = [];
  const sub = [c.name_en, c.name_ja, c.name_romaji].filter(Boolean);
  const vars = (c.name_zh_variants||[]).filter(Boolean);
  rows.push(`<div class="zc-row"><span class="zc-k">名称</span>
    <span class="zc-v"><b>${esc(c.name_zh || c.name_en || '—')}</b>
    ${sub.length? `<span class="zc-sub">${esc(sub.join(' · '))}</span>`:''}
    ${vars.length? `<div class="zc-vars">其他译名：${vars.map(v=>`<span class="zc-var">${esc(v)}</span>`).join('')}</div>`:''}
    ${(c.aliases||[]).length? `<div class="zc-vars">别称：${c.aliases.map(v=>`<span class="zc-var">${esc(v)}</span>`).join('')}</div>`:''}
    </span></div>`);
  // ★ 部数 + 差异说明（不一样时明说，否则用户会以为数据错了）
  rows.push(`<div class="zc-row"><span class="zc-k">登场</span>
    <span class="zc-v">${c.part? `第 ${esc(String(c.part))} 部` :
      '<span class="lc-na">源站未提供</span>'}
    ${c.part_note? `<div class="cc-note">${esc(c.part_note)}</div>`:''}</span></div>`);
  // 替身：可点（去看那张替身档案）
  if((c.stand_names||[]).length){
    rows.push(`<div class="zc-row"><span class="zc-k">替身</span>
      <span class="zc-v">${c.stand_names.map(s=>`<span class="tag lc-rel"
        role="button" tabindex="0" data-ask="${esc(s+' 的六维能力')}"
        >${esc(s)}</span>`).join('')}</span></div>`);
  } else {
    rows.push(`<div class="zc-row"><span class="zc-k">替身</span>
      <span class="zc-v lc-na">源站未标注（第 1、2 部为波纹时代，本就没有替身）</span></div>`);
  }
  // 基本信息：只显示**有值的**那些，没有的整行不出现（不写一串"未提供"）
  const facts = [
    ['性别', c.gender], ['年龄', c.age], ['生日', c.birthday],
    ['身高', c.height], ['体重', c.weight], ['血型', c.blood],
    ['国籍', (c.nations||[]).join('／')],
    ['职业', (c.occupations||[]).join('／')],
    ['所属', (c.affiliations||[]).join('／')],
    ['家人', (c.families||[]).slice(0,5).join('／') + ((c.families||[]).length>5? ' …' : '')],
    ['状态', c.status],
    ['声优', (c.seiyuus||[]).slice(0,3).join('／')],
  ].filter(([k,v]) => v && String(v).trim());
  if(facts.length){
    rows.push(`<div class="cc-facts">${facts.map(([k,v]) =>
      `<div class="cc-fact"><span class="cc-fk">${esc(k)}</span>
        <span class="cc-fv">${esc(String(v).replace(/\n/g,' ／ '))}</span></div>`).join('')}</div>`);
  }
  // ★ 三段原文（简介 / 背景 / 性格）—— 默认收起，展开看原文
  const secs = [
    ['简介', c.bio, c.bio_chunk_id],
    ['背景', c.background, c.background_chunk_id],
    ['性格', c.personality, c.personality_chunk_id],
  ].filter(([n,t]) => t);
  const folds = secs.map(([n,t,cid]) => `
    <details class="cc-fold">
      <summary>${esc(n)}<span class="cc-src">源站原文（英文）
        ${cid? `· 语料块 #${esc(String(cid))}`:''}</span></summary>
      <div class="cc-body">${esc(t)}</div>
    </details>`).join('');
  return `<div class="card" data-sec="sec-char" data-secname="角色资料">
    <h3>角色资料 <span class="h3n">数据来自 jojowiki 角色条目 · 简介/背景/性格为源站原文，未机翻</span></h3>
    <div class="zh-card-inner">${rows.join('')}</div>
    ${folds}
  </div>`;
}

// ★★ M36：替身档案 + 六维雷达合并成一张卡 ★★
//   之前是三张独立卡片（档案 / 答案 / 雷达），六维明明是档案的一部分，
//   却夹在答案和图片中间，读起来割裂。
//   → 档案与雷达并排放在**上方一张卡**，答案另起一张卡在下方。
//   → 窄屏（< 860px）自动改为上下堆叠，避免被挤压。
function renderStandPanel(d){
  const zc = d.zh_card;
  const radar = (d.radar_svg && d.radar_svg.includes('<svg'))
    ? `<div class="sp-radar">
         <div class="media-title">六维能力</div>
         <div class="radar-wrap">${d.radar_svg}</div>
       </div>`
    : '';
  if(!zc && !radar) return '';
  const info = zc ? renderZhCard(zc, d.forms) : '';
  // ★★ M55/M57：「替身资料」是一个**板块**（卡片自带标题 + 可被索引跳转）★★
  //   原来标题是卡片内那行 `.zc-title`「替身档案」，现在提到 h3 上，
  //   并把它的说明挪到 h3 后面的小字（否则同一句话出现两次）。
  //   ★ M57：按用户用词改名「替身信息」→「**替身资料**」
  return `<div class="card" data-sec="sec-stand" data-secname="替身资料">
    <h3>替身资料 <span class="h3n">中文信息来自结构化数据 · 也可直接用日文名或英文名提问</span></h3>
    <div class="stand-panel">
      <div class="sp-info">${info}</div>${radar}
    </div>
  </div>`;
}

// ★★ M57：结果页内的**板块导航**（左侧索引）★★
//   用户原话：「我要的导航栏是搜索结果出来后 能够导航到各个部分
//             如答案 替身资料 检索过程 图片」。
//   ★ 索引项**按实际渲染出的板块生成**（读 [data-sec]）——
//     排名类问题只有「答案」一块，就不会出现"点了跳不过去"的死链；
//     也正因为如此，只有一个板块时整条索引干脆不显示。
//   ★ 板块会**异步**出现（相似替身、图片抓取完）→ 用 MutationObserver 自动补建。
function buildResToc(){
  const toc = $('#resToc'), main = $('#resMain');
  if(!toc || !main) return;
  const secs = [...main.querySelectorAll('[data-sec]')];
  if(secs.length < 2){                     // 只有一块就没必要导航
    toc.hidden = true;
    toc.innerHTML = '';
    return;
  }
  toc.innerHTML = `<div class="rt-title">本页内容</div>` + secs.map((s, i) =>
    `<button class="rt-item" data-target="${esc(s.dataset.sec)}">${
      i + 1}. ${esc(s.dataset.secname || s.dataset.sec)}</button>`).join('');
  toc.hidden = false;
  toc.querySelectorAll('.rt-item').forEach(b => {
    b.onclick = () => {
      // ★ 板块用的是 data-sec **属性**，不是 id ——
      //   实测踩坑：这里原本写 getElementById(data-sec) 永远取到 null，
      //   点击**完全没反应**（不报错、不跳转，最难查的那种）。
      const t = secs.find(s => s.dataset.sec === b.dataset.target);
      // scroll-margin-top 已在 CSS 里给 sticky 顶栏留了位置
      if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
    };
  });
  updateTocActive();
}

// 滚动时高亮「当前板块」：取**最后一个顶部已滚过参考线**的板块
function updateTocActive(){
  const toc = $('#resToc'), main = $('#resMain');
  if(!toc || toc.hidden || !main) return;
  const secs = [...main.querySelectorAll('[data-sec]')];
  if(!secs.length) return;
  const line = 96;                          // 顶栏高度 + 余量
  let cur = secs[0].dataset.sec;
  for(const s of secs){
    if(s.getBoundingClientRect().top - line <= 0) cur = s.dataset.sec;
  }
  toc.querySelectorAll('.rt-item').forEach(b =>
    b.classList.toggle('on', b.dataset.target === cur));
}

// 滚动用 rAF 节流：滚动事件很密，而这里每次都要读布局
let _tocRaf = 0;
window.addEventListener('scroll', () => {
  if(_tocRaf) return;
  _tocRaf = requestAnimationFrame(() => { _tocRaf = 0; updateTocActive(); });
}, {passive: true});

// 板块异步增加（相似替身 / 图片抓完）时自动重建索引
if(window.MutationObserver){
  const _resMain = $('#resMain');
  if(_resMain){
    let _rebuild = 0;
    new MutationObserver(() => {
      if(_rebuild) return;
      _rebuild = requestAnimationFrame(() => { _rebuild = 0; buildResToc(); });
    }).observe(_resMain, {childList: true, subtree: true});
  }
}

function renderAnswer(d){
  const a = d.answer;
  let body = '';
  let refused = false;
  // ★ M51：body 是不是「HTML 片段」（结构化/折叠框）——
  //   是的话要关掉 .answer 的 pre-wrap，否则模板源码里的换行与缩进
  //   会被当成真的换行与缩进渲染（详见 .answer.ans-html 的 CSS 注释）。
  let isHtml = false;

  if(a && a.abstained){ refused = true; body = esc(a.reason);
    if(a.hint) body += '\n\n提示：' + esc(a.hint);
  }
  else if(typeof a==='string'){
    // ★ 生成式：answer 是自然语言字符串 —— ★ 这里**保留** pre-wrap，
    //   因为字符串里的 \n\n 就是要显示成空行。
    body = esc(a);
  }
  else if(Array.isArray(a)){
    // ★ M32：英文原文**默认收起** —— 中文档案卡已经在上面给了要点。
    //   用户的原话是「答案返回一堆英文介绍看不懂」，
    //   所以默认不该再甩一大段英文；想看原文的点一下展开即可。
    body = `<details class="en-fold">
      <summary>展开英文原文（${a.length} 段，语料来源 jojowiki）</summary>
      <div class="en-body">${a.map(x=>esc(x)).join('\n\n')}</div></details>`;
    isHtml = true;
  }
  else if(a && typeof a==='object'){
    body = renderStructured(a);
    isHtml = true;
  }
  else body = esc(String(a ?? '（无内容）'));

  // ★★ M55/M57：搜索结果按**板块**组织，每块带 data-sec（供左侧索引跳转）★★
  //   板块顺序按用户原话：「如答案 替身资料 检索过程 图片」
  //     ① 答案 ② 替身资料 ③ 检索过程 ④ 图片 ⑤ 相似替身
  let html = `<div class="card" data-sec="sec-answer" data-secname="答案">
    <h3>答案${d.mode==='generate'?' <span style="color:var(--warn);font-weight:400">（生成式）</span>':''}</h3>
    <div class="answer ${refused?'answer-refused':''}${isHtml?' ans-html':''}">${body}</div>`;
  if(d.warning) html += `<div class="alert">⚠ ${esc(d.warning)}</div>`;
  if(d.generation) html += renderGeneration(d.generation, d.faithfulness);
  html += '</div>';
  html += renderStandPanel(d);          // ② 替身资料
  html += renderLocationPanel(d);       // ②′ 地点资料（M65，只在 route=location 时出现）
  html += renderCharacterPanel(d);      // ②″ 角色资料（M66，只在 route=character 时出现）
  // ③ 检索过程 —— ★ M57：从"页顶的折叠块"变成**正式板块**（可被左侧索引到）
  //    证据（原文）也归这里：它就是这条答案的出处
  html += `<div class="card" data-sec="sec-proc" data-secname="检索过程">
      <details class="proc-fold" id="procCard">
        <summary>检索过程<span class="proc-hint">（点击展开：意图识别 / 检索方式 / 证据 / 组织）</span></summary>
        <div class="steps" id="proc"></div>
      </details>
      ${renderEvidence(d.evidence)}
    </div>`;
  html += renderMedia(d);               // ④ 图片（自带卡片与标题）
  html += '<div id="simBox"></div>';    // ⑤ 相似替身占位
  $('#ans').innerHTML = html;
  // ★ M19：图片渲染完按真实宽高比调整卡片高度（否则竖图留大片空白）
  applyShotHeights($('#ans'));
  // ★★ M66：统一的可点问句 —— `data-ask` + 事件委托，**不用内联 onclick** ★★
  //   原因：内联写法必须把值放进 HTML 属性里，而**替身/地点/角色名里真的有引号**：
  //     `Devil's Palm`（第 7 部地点）· `Daniel J. D'Arby`（角色）
  //   → 无论用单引号还是双引号属性，都会被**提前闭合**，onclick 变成半截代码，
  //     点击毫无反应（不报错、最难查的那一类）。
  //   ★ M65 只修了我自己那处（showLocEvidence 改索引），
  //     **地点列表那处还留着同样的隐患** —— 本轮一并改成委托。
  $('#ans').querySelectorAll('[data-ask]').forEach(el => {
    const go = () => ask(el.dataset.ask);
    el.onclick = go;
    el.onkeydown = e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); go(); }
    };
  });
  // ★ M32：异步拉相似替身 —— 不阻塞主答案（它是增强项）
  if(d.zh_card && d.zh_card.stand_id) loadSimilar(d.zh_card.stand_id);
  // ★ M57：板块渲染完就生成左侧索引（异步新增的板块由观察器补建）
  buildResToc();
}

// ★★ M32：相似替身（按六维数值）★★
//   ★ 刻意用数值距离而不是向量索引：能力相似本来就该看六维，
//     且不依赖 7 GB 模型（--no-vector 下也能用）。
//   ★ 后端只在**共同维度 ≥3** 时才给推荐，不足会返回 note 说明原因。
function loadSimilar(sid){
  fetch(`${API}/similar/${encodeURIComponent(sid)}?k=5`)
    .then(r=>r.json())
    .then(d=>{
      const box = document.getElementById('simBox');
      if(!box) return;
      if(d.error){ box.innerHTML = ''; return; }
      const list = d.similar || [];
      // ★ M57：这一块也是板块（可被左侧索引跳转）——它是**异步**来的，
      //   索引由 MutationObserver 自动补建
      const head = `<div class="card" data-sec="sec-similar" data-secname="相似替身"><h3>相似替身
        <span class="sim-scope">${esc(d.scope||'')}</span></h3>`;
      if(!list.length){
        box.innerHTML = head +
          `<div class="meta">${esc(d.note||'数据不足，暂不给出推荐')}</div></div>`;
        return;
      }
      const items = list.map(x=>{
        const diffs = Object.entries(x.diff||{}).slice(0,6)
          .map(([k,v])=>`<span class="sd">${esc(k)} ${v>0?'+':''}${v}</span>`)
          .join('');
        // ★ M66：改用 data-ask + 委托 —— 这个内联 onclick 从 M32 起就带着隐患
        //   （替身名里若有撇号会提前闭合属性）。它与 renderAnswer 里的委托是同一套：
        //   loadSimilar 是**异步**的，所以在下面单独再挂一次事件。
        return `<div class="sim-item" role="button" tabindex="0"
             data-ask="${esc((x.name_zh || x.name) + ' 的六维能力')}">
          <div class="sim-name">${esc(x.name_zh || x.name)}
            ${x.name_zh? `<span class="zc-sub">${esc(x.name)}</span>`:''}</div>
          <div class="sim-meta">距离 ${x.distance} · 共同维度 ${x.common_dims}</div>
          <div class="sim-diff">${diffs}</div>
        </div>`;
      }).join('');
      box.innerHTML = head + `<div class="sim-list">${items}</div>
        ${d.note? `<div class="meta sim-note">${esc(d.note)}</div>`:''}</div>`;
      // ★ 异步插入的节点不在 renderAnswer 那次委托的作用域里 → 这里再挂一次
      box.querySelectorAll('[data-ask]').forEach(el => {
        el.onclick = () => ask(el.dataset.ask);
        el.onkeydown = e => {
          if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ask(el.dataset.ask); }
        };
      });
    })
    .catch(()=>{ /* 相似替身是增强项，失败不影响主答案 */ });
}

/* ================================================================
   M17：雷达图 + 图片渲染
   ================================================================ */
const IMG_KIND_CN = {
  stand:'替身本体', user:'替身使者', manga:'漫画截图',
  anime:'动画截图', misc:'其他'
};

function renderMedia(d){
  // ★★ M55：「图片」是一个**板块** —— 独立卡片 + 自己的标题 ★★
  //   三种状态（已就绪 / 抓取中 / 失败）都装在同一张卡里，
  //   这样异步抓完替换内容时，标题不会跟着消失。
  //   ★ 没有图片信息时返回 ''（不占位、不出空板块）
  const im = d.stand_images || {};
  const groups = ['stand','user','manga','anime','misc'];
  const has = groups.some(k => (im[k]||[]).length);
  const head = `<div class="card" data-sec="sec-images" data-secname="图片"><h3>图片</h3>`;
  if(has){
    return head + imgSectionHTML(im) + '</div>';
  }
  if(im.state === 'pending'){
    // ★ M18：后台抓图中 —— 给占位 + 启动轮询，不让用户干等
    pollImages(im.stand_id);
    return head + `<div class="media-block" id="imgPending">
      <div class="img-wait">
        <span class="spin"></span>图片正在后台抓取（约 10-30 秒），
        抓完会自动出现在这里，不必重复提问
      </div>
    </div></div>`;
  }
  if(im.error){
    return head + `<div class="media-block">
      <div class="img-note">未能获取：${esc(im.error)}</div></div></div>`;
  }
  return '';
}

/* 图片区块 HTML（已就绪时） */
function imgSectionHTML(im){
  const groups = ['stand','user','manga','anime','misc'];
  const secs = groups.map(k=>{
    const arr = im[k]||[];
    if(!arr.length) return '';
    const cells = arr.map(x=>
      `<figure class="shot">
         <img src="${esc(x.url)}" alt="${esc(x.caption||IMG_KIND_CN[k]||k)}"
              loading="lazy" onclick="zoomImg('${esc(x.url)}')">
         <!-- ★ M59：题注优先用 caption —— 形态专属图会带「ACTn」，
              这样母体的图集能看出"这张是第几形态"，而不是全都叫"本体" -->
         <figcaption title="${esc(x.caption||'')}">${
           esc(x.caption||IMG_KIND_CN[k]||k)}</figcaption>
       </figure>`).join('');
    return `<div class="img-group">
        <div class="img-group-t">${esc(IMG_KIND_CN[k]||k)}
          <span class="cnt">${arr.length}</span></div>
        <div class="img-grid">${cells}</div>
      </div>`;
  }).join('');
  return `<div class="media-block" id="imgDone">
    <!-- ★ M55：卡片标题已经是「图片」，这里只报数量与分类口径，避免重复 -->
    <div class="media-title"><span class="cnt">${im.total||0}</span> 张 · 按来源分组</div>
    ${secs}
    <div class="img-note">分类按 jojowiki 源文件名推断（悬停缩略图可看原名）；
      版权归荒木飞吕彦 / 集英社所有，来源 jojowiki.com</div>
  </div>`;
}

/* ★ M19：按图片真实宽高比设高度，让竖图不被压扁、也不留大片空白。
   实测本地 74 张图里 **51 张是竖图**（宽高比中位 0.83、最窄 0.37，
   即 400x1068 的长立绘），另有 20 张横图（最宽 4.76:1）。
   → 固定高度 + cover：竖图被裁头尾（用户反馈"显示不全"）
   → 固定高度 + contain：横图被撑高、下方大片空白
   → 所以按真实比例算高度：卡片高度 = 宽度 × (h/w)，
     下限 96px（横图最扁时也够看）、上限 420px（超长立绘不再更高）。 */
function applyShotHeights(root){
  if(!root) return;
  root.querySelectorAll('.shot img').forEach(img=>{
    const fit = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      if(!w || !h) return;              // 还没加载完，load 事件会再调一次
      const boxW = img.clientWidth || (img.parentElement?.clientWidth) || 160;
      let target = Math.round(boxW * (h / w));   // 按真实比例算高度
      target = Math.max(96, Math.min(420, target));
      img.style.height = target + 'px';
    };
    if(img.complete && img.naturalWidth) fit();
    else img.addEventListener('load', fit, {once:true});
  });
  // 列数随窗口宽度变，尺寸变了要重算高度
  clearTimeout(window._shotRz);
  window._shotRz = setTimeout(()=>applyShotHeights(root), 200);
}

/* ★ M18：轮询图片抓取状态（最多约 60 秒，1.5 秒一次） */
let _imgPollTimer = null;
function pollImages(standId){
  if(!standId) return;
  if(_imgPollTimer) clearTimeout(_imgPollTimer);
  let tries = 0;
  const tick = async ()=>{
    tries++;
    if(tries > 40){                       // 60 秒还没好就放弃，不打扰用户
      const el = document.getElementById('imgPending');
      if(el) el.innerHTML = '<div class="img-note">图片抓取超时，'
        + '可稍后重新提问，或运行 fetch_stand_images.py 手动抓取</div>';
      return;
    }
    try{
      const r = await fetch(`/images/status/${encodeURIComponent(standId)}`);
      if(!r.ok) throw new Error('HTTP '+r.status);
      const im = await r.json();
      if(im.state === 'done' && im.total > 0){
        const el = document.getElementById('imgPending');
        if(el){
          const tmp = document.createElement('div');
          tmp.innerHTML = imgSectionHTML(im);
          const newEl = tmp.firstElementChild;
          el.replaceWith(newEl);
          // ★ M19：异步插入的图也要按真实比例调高度
          applyShotHeights(newEl);
        }
        return;                            // 完成，停止轮询
      }
      if(im.state === 'failed'){
        const el = document.getElementById('imgPending');
        if(el) el.innerHTML = '<div class="img-note">图片抓取失败：'
          + esc(im.error||'未知原因') + '</div>';
        return;
      }
    }catch(e){ /* 网络抖动就继续轮询 */ }
    _imgPollTimer = setTimeout(tick, 1500);
  };
  _imgPollTimer = setTimeout(tick, 1200);
}

function zoomImg(url){
  let z = document.getElementById('zoom');
  if(!z){
    z = document.createElement('div');
    z.id = 'zoom'; z.className = 'zoom';
    z.onclick = ()=>{ z.style.display='none'; };
    document.body.appendChild(z);
  }
  z.innerHTML = `<img src="${esc(url)}" alt="">`;
  z.style.display = 'flex';
}

// ★★ M38：类别中文映射 ★★
//   ★ 之前这里是**一套与后端重复且已经漂移**的映射：
//     缺 CONDITIONAL / CONDITIONAL_NO_BASE / NOT_APPLICABLE / UNPARSED / NONE，
//     而键名还把 EMPTY_SLOT 写成了 EMPTYSLOT ——
//     于是 53 行 EMPTY_SLOT + 20 行 CONDITIONAL 在界面上显示英文。
//   → 优先用后端返回的 `category_cn`（后端 CAT_CN 是权威、且已覆盖全部 9 类），
//     这份只作兜底，键名与后端保持逐字一致。
//   ★ 教训：同一份映射写在两处，早晚会漂移 —— 能由后端给就别在前端再抄一遍。
const CAT_CN = {
  RANKED:'正常等级', NONE:'明确无此能力', EMPTY_SLOT:'数据缺失（空位）',
  UNKNOWN:'未知（存在争议）', INFINITE:'无限',
  CONDITIONAL:'条件值（附条件说明）',
  CONDITIONAL_NO_BASE:'条件值（无基础等级）',
  NOT_APPLICABLE:'该源未提供', UNPARSED:'未解析',
};

function renderStructured(a){
  const t = a.type;
  // ★ 降级提示（DB 不可用时 answer 是 {note, hint}，没有 type 字段）
  if(a.note && !t){
    return `<div style="color:var(--warn)">${esc(a.note)}</div>` +
           (a.hint? `<div class="meta" style="margin-top:8px">${
             esc(a.hint)}</div>` : '');
  }
  // ★★ M65：地点类答案（route=location）★★
  //   完整档案在上方「地点资料」卡里，这里只给**一句话结论**，
  //   避免同一份信息在屏幕上出现两次。
  if(t==='location_fact'){
    const nm = esc(a.name_zh || a.name_en || '—');
    const path = (a.place_paths||[]).filter(p=>p&&p.length)
      .map(p=>p.join(' → ')).join(' ／ ');
    const ps = a.part? `第 ${esc(String(a.part))} 部` : '部数未知';
    const types = (a.types||[]).slice(0,4);
    return `<div style="margin-bottom:8px"><b style="font-size:20px">${nm}</b>
        <span class="zc-sub">${esc(a.name_en||'')}</span></div>
      <div class="lc-line">${ps}${types.length? ' · '+types.map(esc).join('／') : ''}
        ${path? ` · 位于 <b>${esc(path)}</b>` : ' · <span class="lc-na">源站未提供归属</span>'}</div>
      ${(a.related_stands||[]).length? `<div class="lc-line">相关替身：
        ${a.related_stands.slice(0,8).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}
        ${a.related_stands.length>8? `<span class="meta">…共 ${a.related_stands.length} 个</span>`:''}
      </div>`:''}`;
  }
  if(t==='location_list'){
    const items = a.items||[];
    return `<div style="margin-bottom:8px">${esc(a.scope||'')} 共
        <b>${esc(String(a.count))}</b> 个地点</div>
      <div>${items.map(x=>`<span class="tag lc-rel" role="button" tabindex="0"
        data-ask="${esc((x.name||x.name_en)+' 是什么地方')}"
        >${esc(x.name||x.name_en)}${x.part? `<span class="lc-p">第${esc(String(x.part))}部</span>`:''}</span>`).join('')}</div>
      ${a.note? `<div class="meta" style="margin-top:8px">${esc(a.note)}</div>`:''}`;
  }
  if(t==='location_related'){
    const loc = a.location||{};
    const list = (arr,cls) => (arr||[]).length
      ? `<div class="lc-line">${cls}：${arr.map(x=>`<span class="tag">${esc(x.name)}</span>`).join('')}</div>`
      : '';
    // ★ M70 同名消歧：这个名字既是地点也是篇章时，明确说清口径
    const arc = a.also_story_arc;
    const arcBox = arc ? `<div class="lc-line" style="margin-top:10px;padding:8px 10px;border-left:3px solid #d4a017;background:rgba(212,160,23,.08)">
        <b>⚠ 同名歧义</b>：${esc(arc.note)}
        ${arc.name? `<div style="margin-top:4px;font-size:12px;opacity:.85">
          篇章：${esc(arc.name)}${arc.part?`（第 ${esc(String(arc.part))} 部）`:''}${arc.chapters&&arc.chapters.length?` · 章节 ${esc(arc.chapters.join('、'))}`:''}</div>`:''}
      </div>` : '';
    return `<div style="margin-bottom:8px"><b>${esc(loc.name||'')}</b>
        <span class="zc-sub">${esc(loc.name_en||'')}</span> —— 该地点条目正文里写到的：</div>
      ${list(a.stands,'相关替身')}${list(a.characters,'相关角色')}
      ${(!(a.stands||[]).length && !(a.characters||[]).length)
        ? '<div>该地点条目正文里没有写到具体替身或角色。</div>' : ''}
      ${arcBox}
      ${a.note? `<div class="meta" style="margin-top:8px">${esc(a.note)}</div>`:''}`;
  }
  if(t==='location_hint'){
    return `<div>${esc(a.note)}</div>`;
  }
  // ★★ M71：篇章口径（「这一段里有哪些替身」）★★
  //   与 location_related 同构：只列有语料证据的，每条带话数。
  if(t==='arc_fact'){
    const arc=a.arc||{};
    const head=`<div style="margin-bottom:8px"><b>篇章：${esc(arc.name||'')}</b>
        ${arc.part?`<span class="lc-p">第${esc(String(arc.part))}部</span>`:''}
        ${arc.chapters&&arc.chapters.length?`<span class="zc-sub">章节 ${esc(arc.chapters.join('、'))}</span>`:''}
        —— 该篇章章节范围内的出场：</div>`;
    // 替身：带形态倍数字
    const standTags=(a.stands||[]).map(x=>`<span class="tag" title="${esc(x.snippet||'')}">
        ${esc(x.name||'')}${x.n_forms>1?` <i style="opacity:.7;font-style:normal">×${esc(String(x.n_forms))}</i>`:''}
        ${x.chapter?`<i style="opacity:.6;font-style:normal;font-size:11px"> ch${esc(String(x.chapter))}</i>`:''}
      </span>`).join('');
    // ★ M72：角色（与替身同构，悬停同样显示原文）
    const charTags=(a.characters||[]).map(x=>`<span class="tag" title="${esc(x.snippet||'')}">
        ${esc(x.name||'')}
        ${x.chapter?`<i style="opacity:.6;font-style:normal;font-size:11px"> ch${esc(String(x.chapter))}</i>`:''}
      </span>`).join('');
    const noStand=(a.stands||[]).length?'':'<div>该篇章范围内没有抓到替身出场记录。</div>';
    const noChar=(a.characters||[]).length?'':'<div>该篇章范围内没有角色出场记录。</div>';
    return head
      + (standTags?`<div class="lc-line">相关替身：${standTags}</div>`:'') + noStand
      + (charTags?`<div class="lc-line">相关角色：${charTags}</div>`:'') + noChar
      + (a.note?`<div class="meta" style="margin-top:8px">${esc(a.note)}</div>`:'');
  }
  // ★★ M66：角色类答案（route=character）★★
  //   完整档案在上方「角色资料」卡里，这里只给**结论 + 首段简介**。
  if(t==='character_fact'){
    const nm = esc(a.name_zh || a.name_en || '—');
    const meta = [a.part? `第 ${esc(String(a.part))} 部` : '',
                  (a.stands||[]).length? `替身 ${esc((a.stands||[]).join('、'))}` : '',
                  a.status? esc(a.status) : ''].filter(Boolean).join(' · ');
    return `<div style="margin-bottom:8px"><b style="font-size:20px">${nm}</b>
        <span class="zc-sub">${esc(a.name_en||'')}</span>
        ${a.name_ja? `<span class="zc-sub">${esc(a.name_ja)}</span>`:''}</div>
      ${meta? `<div class="lc-line">${meta}</div>`:''}
      ${a.part_note? `<div class="cc-note">${esc(a.part_note)}</div>`:''}
      ${a.bio? `<div class="cc-bio">${esc(a.bio)}</div>
        <div class="meta">▲ 以上为源站首段原文（英文）。
          ${a.bio_chunk_id? `语料块 #${esc(String(a.bio_chunk_id))}`:''}
          中文信息见下方「角色资料」。</div>`
        : '<div class="meta">该角色条目没有可用的首段简介。</div>'}`;
  }
  if(t==='character_list'){
    const items = a.items||[];
    return `<div style="margin-bottom:8px">${esc(a.scope||'')} 共
        <b>${esc(String(a.count))}</b> 个角色</div>
      <div>${items.map(x=>`<span class="tag lc-rel" role="button" tabindex="0"
        data-ask="${esc((x.name||x.name_en)+' 是谁')}"
        >${esc(x.name||x.name_en)}${x.part? `<span class="lc-p">第${esc(String(x.part))}部</span>`:''}${
          x.has_stand===false? '<span class="lc-p">无替身</span>':''}</span>`).join('')}</div>
      ${a.note? `<div class="meta" style="margin-top:8px">${esc(a.note)}</div>`:''}`;
  }
  if(t==='character_stands'){
    const st = a.stands||[];
    return `<div style="margin-bottom:8px">${esc(a.character||'')} 的替身</div>
      ${st.length? `<div style="font-size:20px;font-weight:700;margin-bottom:8px">${
        st.map(n=>`<span class="tag lc-rel" role="button" tabindex="0"
          data-ask="${esc(n+' 的六维能力')}">${esc(n)}</span>`).join('')}</div>`
        : '<div>该角色条目未标注替身。</div>'}
      ${a.note? `<div class="meta">${esc(a.note)}</div>`:''}`;
  }
  if(t==='character_hint'){
    return `<div>${esc(a.note)}</div>`;
  }
  if(t==='fact'){
    // ★★ M38：条件值提示 ★★
    //   像「黑色安息日的破坏力」这类，值本身是 E，
    //   但源数据注明「束缚敌人时是 A」。以前只答 E ——
    //   答案**看起来完整**，用户不会追问，比答错更难发现。
    let cond = '';
    if(a.conditional){
      cond = `<div class="caveat"><b>条件限定</b>
        <div class="cv-body">${esc(a.caveat || '')}</div>
        <div class="cv-src">源数据原文：<code>${esc(a.conditional.note)}</code></div>
      </div>`;
    }else if(a.caveat){
      cond = `<div class="caveat"><div class="cv-body">${esc(a.caveat)}</div></div>`;
    }
    // 同替身其他维度也带条件时提示 —— 六维并排展示时
    // 某格其实有条件，整体印象会被误导
    let others = '';
    if((a.other_conditions||[]).length){
      others = `<div class="cv-others">该替身另有维度带条件限定：
        ${a.other_conditions.map(o=>
          `<div class="cv-other">· ${esc(o.dimension_cn)}
            <b>${esc(o.value_label ?? '无固定等级')}</b>
            <span class="cv-src-inline">${esc(o.note)}</span></div>`).join('')}
      </div>`;
    }
    return `<dl class="kv">
      <dt>替身</dt><dd>${esc(a.stand_name)}</dd>
      <dt>维度</dt><dd>${esc(a.dimension_cn)}（${esc(a.dimension)}）</dd>
      <dt>数值</dt><dd>${esc(a.value_label ?? '—')}</dd>
      <dt>原始值</dt><dd>${esc(a.raw ?? '—')}</dd>
      <dt>类别</dt><dd><span class="c-cat ${esc(a.category)}"
              title="数据里的原始类别：${esc(a.category||'')}"
          >${esc(a.category_cn || CAT_CN[a.category] || a.category || '—')}</span></dd>
    </dl>${cond}${others}`;
  }
  if(t==='extreme' || t==='extreme_top'){
    const items = a.winners || a.items || [];
    // ★ M38：带条件限定的条目要逐条标出。否则「射程最高」的
    //   榜首可能是 Moody Blues（仅回放时成立），看着像硬实力。
    const caveat = a.caveat
      ? `<div class="caveat"><div class="cv-body">${esc(a.caveat)}</div></div>`
      : '';
    // ★ M54：∞ 的条目要显式标出来 —— 它被排在 A 之前，
    //   不标的话看着像排序错了（实测「速度最高」榜首是天堂制造 ∞）。
    //   ★ 兼容两种数据：extreme_top 的 items 带 `infinite` 标记，
    //     而 extreme(max/min) 的 winners 只有 `cat`。
    const dim = a.dimension_cn || '';
    const tagOf = x => {
      const inf = x.infinite || x.cat === 'INFINITE';
      const tip = [
        x.conditional_note ? esc(x.conditional_note) : '',
        inf ? `${esc(dim)} ∞（无限，超出 E~A 等级，无法与等级直接比较）` : '',
      ].filter(Boolean).join(' · ');
      return `<span class="tag${x.conditional_note ? ' c-cond' : ''}${
        inf ? ' c-inf' : ''}" title="${tip}">${esc(x.name)}${
        inf ? ' ∞' : ''}${x.conditional_note ? ' ※' : ''}</span>`;
    };
    return `<div style="margin-bottom:8px">${esc(a.dimension_cn)} ${esc(a.direction||'最高')}
      = <b>${esc(a.value_label ?? (items[0]&&items[0].label) ?? '—')}</b></div>
      <div>${items.map(tagOf).join('')}</div>
      ${caveat}`;
  }
  if(t==='count' || t==='count_by_level'){
    return `<dl class="kv"><dt>范围</dt><dd>${esc(a.scope||a.dimension_cn)}</dd>
      <dt>数量</dt><dd><b>${esc(a.count)}</b></dd></dl>`;
  }
  if(t==='part_list'){
    // ★ 「第X部有哪些替身」：列出该部全部替身（补数据后新增）
    const items=a.items||[];
    return `<div style="margin-bottom:8px">第 ${esc(a.part)} 部共
        <b>${esc(a.count)}</b> 个替身</div>
      <div>${items.map(x=>`<span class="tag">${esc(x.name)}</span>`).join('')}</div>`;
  }
  if(t==='owner'){
    return `<dl class="kv"><dt>替身</dt><dd>${esc(a.stand_name)}</dd>
      <dt>使用者</dt><dd><b>${esc(a.owner)}</b></dd></dl>`;
  }
  if(t==='stands_of_owner'){
    return `<div style="margin-bottom:8px">${esc(a.owner)} 的替身（${a.count} 个）</div>
      <div>${(a.stands||[]).map(x=>`<span class="tag">${esc(x.name)}</span>`).join('')}</div>`;
  }
  // ★★ M20：「XX 的替身是什么」→ 直接给替身名。
  //   用户要的就是这一个词，所以放最上面、加粗放大，
  //   不再糊一整段能力介绍。
  if(t==='stand_of'){
    const st=a.stands||[];
    // ★ M21：有中文名就并列显示（替身英文名 + 中文名）
    const names = st.map(x=> x.zh
        ? `${esc(x.name)}<span style="font-size:15px;color:var(--text-dim);
            margin-left:8px">${esc(x.zh)}</span>`
        : esc(x.name));
    return `<div style="margin-bottom:10px">
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:6px">
          ${esc(a.owner)} 的替身${a.count>1? `（${a.count} 个）`:''}
        </div>
        <div style="font-size:22px;font-weight:700;line-height:1.5;
                    color:var(--text)">${names.join('、')}</div>
        ${st.some(x=>x.part)? `<div class="meta" style="margin-top:8px">
          ${st.map(x=>`${esc(x.zh||x.name)}${x.part?`（第${esc(x.part)}部）`:''}`).join('　')}
        </div>`:''}
      </div>`;
  }
  if(t==='forms'){
    return `<div>${esc(a.stand_name)} 共 <b>${a.count}</b> 个形态</div>
      <div>${(a.items||[]).map(x=>`<span class="tag">${esc(x.form_id||x)}</span>`).join('')}</div>`;
  }
  if(t==='part_stats'){
    return `<table><thead><tr><th>部</th><th>名称</th>
      <th style="text-align:right">替身数</th>
      <th style="text-align:right">六维完整</th>
      <th style="text-align:right">平均综合</th></tr></thead><tbody>
      ${(a.parts||[]).map(p=>`<tr><td>${p.part}</td><td>${esc(p.name)}</td>
        <td class="num">${p.n_stands}</td>
        <td class="num">${p.n_with_composite}</td>
        <td class="num">${p.avg_composite ?? '—'}</td></tr>`).join('')}
      </tbody></table>`;
  }
  return `<pre style="font-size:12px;white-space:pre-wrap">${
    esc(JSON.stringify(a,null,2))}</pre>`;
}

function renderGeneration(g, f){
  // ---- 生成层详情 ----
  const model = (g.model||'').split('\\').pop();
  let h = `<div class="geninfo"><b>生成层</b>：${esc(model)}`
        + ` · ${esc(g.device||'')} · temp=${g.temperature}`
        + `<br><b>token</b>：prompt ${g.n_prompt_tokens} → gen ${g.n_gen_tokens}`
        + `<br><b>耗时</b>：生成 ${g.elapsed_ms} ms`
        + (g.load_ms>1000? `（含首次加载 ${(g.load_ms/1000).toFixed(0)} s）`:'');
  // ---- 忠实度（机械核对，不是 LLM 判分）----
  if(f && !f.error){
    const t = f.trace_ratio;
    const cls = t>=0.95?'ok':(t>=0.7?'warn':'bad');
    const num = (f.numeric_ratio==null? null : f.numeric_ratio);
    h += `<br><b>忠实度</b>（机械核对）：溯源
      <span class="${cls}" style="font-family:var(--mono)">${
        t==null?'n/a':t.toFixed(2)}</span>`;
    if(num!=null) h+= ` · 数值 ${num.toFixed(2)}`;
    if(f.contradiction_rate>0) h+= ` · <span class="bad">矛盾 ${f.contradiction_rate.toFixed(2)}</span>`;
    if(f.hedging) h+= ` · <span style="color:var(--warn)">空洞回答</span>`;
    h += `<div class="fbar"><i class="${cls}" style="width:${
      Math.round((t||0)*100)}%"></i></div>`;
    h += `<span style="font-size:11px">${
      t>=0.95?'几乎完全忠于证据':
      t>=0.7?'大部分有据，少部分超出证据':'★ 有明显超出证据的内容'}</span>`;
  }else if(f && f.error){
    h += `<br><span class="bad">忠实度计算失败：${esc(f.error)}</span>`;
  }
  return h + `</div>`;
}

function renderEvidence(ev){
  if(!ev || !ev.length) return '';
  return `<details class="ev"><summary>证据 ${ev.length} 条（点击展开原文）</summary>
    ${ev.map((e,i)=>`
      <div class="ev-item">
        <div class="ev-head">
          <span>#${i+1}</span><span>${esc(e.type)}</span>
          ${e.stand_name?`<span>${esc(e.stand_name)}</span>`:''}
          ${e.chunk_type?`<span>${esc(e.chunk_type)}</span>`:''}
          ${e.chunk_id!=null?`<span>chunk#${e.chunk_id}</span>`:''}
          ${e.merged?`<span style="color:var(--warn)">由 ${e.n_base_blocks} 个原始块合并</span>`:''}
          ${(!e.merged && e.n_chars)?`<span>${e.n_chars} 字</span>`:''}
          ${e.table?`<span>表:${esc(e.table)}</span>`:''}
          ${e.field?`<span>字段:${esc(e.field)}</span>`:''}
          ${e.stand_id?`<span>${esc(e.stand_id)}</span>`:''}
        </div>
        ${e.content? `<div class="ev-text">${esc(e.content)}</div>`:''}
        ${(e.merged && e.base_chunk_ids && e.base_chunk_ids.length)
          ? `<div class="meta" style="margin-top:6px">
               可回溯的原始块：${e.base_chunk_ids.map(x=>'#'+x).join('、')}
             </div>` : ''}
      </div>`).join('')}
    </details>`;
}

// ---------- 数据浏览 ----------
async function askB(n){
  n = (n!==undefined? n : $('#bi').value).trim();
  if(!n) return;
  $('#bans').innerHTML = '<div class="card"><div class="loading">查询中…</div></div>';
  try{
    // 先按名称找 stand_id
    let id = n.toLowerCase().replace(/[^a-z0-9]+/g,'_');
    if(!/^_|_$/.test(id)) id = id;
    let r = await fetch(`${API}/stands/${encodeURIComponent(id)}`);
    if(!r.ok){
      // 退而用 search（从 chunks 找）
      r = await fetch(`${API}/query?` +
        new URLSearchParams({q:n, top_k:'1'}), {method:'POST'});
      const d = await r.json();
      $('#bans').innerHTML = `<div class="card"><h3>未找到 stand_id</h3>
        <div class="meta">尝试的 id：${esc(id)}</div>
        <div class="meta">提示：检索接口对「${esc(n)}」的答案类型是
        ${esc(d.answer_type)}，请到「问答」页查看</div></div>`;
      return;
    }
    renderStand(await r.json());
  }catch(e){
    $('#bans').innerHTML = `<div class="card"><div class="alert err">${esc(e.message)}</div></div>`;
  }
}

function renderStand(d){
  const st = d.stats || {};
  const dims = ['PWR','SPD','RNG','STA','PRC','DEV'];
  const DN = {PWR:'破坏力',SPD:'速度',RNG:'射程',STA:'持续力',PRC:'精密性',DEV:'成长性'};
  let rows = '';
  for(const k of dims){
    // ★★ M49：接口的 stats[k] 是 {value, label, raw, category} ★★
    //   此前写的是 st[k] / st[k+'_raw'] / st[k+'_cat'] ——
    //   值取到对象（渲染成 `[object Object]`），
    //   另两个键**根本不存在** → 「原始」恒为「—」、「类别」恒空白。
    const cell = st[k] || {};
    const v   = cell.label;      // 等级字母 E/D/C/B/A（缺失为 null）
    const raw = cell.raw;        // 数据源原始字面量（可能是 '∞' / '?'）
    const cat = cell.category;   // 编码类别 RANKED/UNKNOWN/INFINITE/…
    const cn = {RANKED:'正常',UNKNOWN:'未知',INFINITE:'无限',
                EMPTYSLOT:'空缺',UNCATEGORIZED:'未分类'}[cat] || cat || '—';
    rows += `<tr><td>${DN[k]}</td>
      <td class="num">${v==null?'—':esc(v)}</td>
      <td class="num">${raw==null?'—':esc(raw)}</td>
      <td class="c-cat ${esc(cat||'')}">${esc(cn)}</td></tr>`;
  }
  $('#bans').innerHTML = `
    <div class="card">
      <h3>${esc(d.name_en||d.stand_id)}</h3>
      <dl class="kv">
        ${d.name_zh?`<dt>中文名</dt><dd>${esc(d.name_zh)}${
            (d.name_zh_variants&&d.name_zh_variants.length)
              ?` <span style="opacity:.7">（异译：${esc(d.name_zh_variants.join('、'))}）</span>`
              :''}</dd>`:''}
        <dt>stand_id</dt><dd>${esc(d.stand_id)}</dd>
        <dt>所属部</dt><dd>${d.part==null?'—':esc(d.part)+' · '+esc(d.part_name||'')}</dd>
        <dt>使用者</dt><dd>${esc(d.owner||'—')}</dd>
        <dt>形态数</dt><dd>${esc(d.n_forms??'—')}</dd>
        <dt>综合分</dt><dd>${st.composite==null?'—':esc(st.composite)}</dd>
        <dt>文本块</dt><dd>${esc(d.n_chunks??'—')}</dd>
      </dl>
    </div>
    <div class="card">
      <h3>六维能力值</h3>
      <!-- ★ M49：加 class="tight"（width:auto）。
           表格默认 width:100%，四列内容都很短（维度/等级/原始/类别各 2 字），
           多余空间被均摊 → 实测「值」列被撑到 504px、
           「类别」列 178px 而内容只有 2 字，看着就是"后面一大片空白"。 -->
      <table class="tight"><thead><tr><th>维度</th><th style="text-align:right">值</th>
        <th style="text-align:right">原始</th><th>类别</th></tr></thead>
        <tbody>${rows}</tbody></table>
    </div>
    ${(d.forms&&d.forms.length)? `<div class="card"><h3>形态列表</h3>
      <div>${d.forms.map(f=>`<span class="tag">${esc(f.name_en||f)}</span>`).join('')}</div>
    </div>`:''}
    ${(d.conflicts&&d.conflicts.length)? `<div class="card"><h3>冲突记录</h3>
      <table><thead><tr><th>维度</th><th>主源</th><th>镜像源</th><th>消解</th>
        <th>策略</th></tr></thead><tbody>
      ${d.conflicts.map(c=>`<tr><td>${esc(c.dimension)}</td>
        <td class="num">${esc(c.primary_value??'—')}</td>
        <td class="num">${esc(c.mirror_value??'—')}</td>
        <td class="num">${esc(c.resolved_value??'—')}</td>
        <td>${esc(c.resolution||'—')}</td></tr>`).join('')}
      </tbody></table></div>`:''}`;
}

// ---------- 冲突 ----------
async function loadC(status){
  $('#cans').innerHTML = '<div class="loading">加载中…</div>';
  try{
    const r = await fetch(`${API}/conflicts?status=${status}&limit=200`);
    const d = await r.json();
    const list = d.conflicts || d.items || [];
    if(!list.length){ $('#cans').innerHTML='<div class="empty">没有符合条件的记录</div>'; return; }

    // ★★ M22：按 (替身, 维度) **分组** ★★
    //   实测一个 (替身,维度) 可能有多条冲突记录——
    //   那是**同一主源对比了多个镜像源**（如 tusk_act3/RNG 同时对比
    //   csv_topology 和 csv_bogdan），不是重复数据。
    //   → 一张卡片 = 一个 (替身,维度)，内部列出全部源对比行。
    const groups = new Map();
    list.forEach(c=>{
      const k = `${c.stand_id}|${c.dim||c.stat_dim}`;
      if(!groups.has(k)) groups.set(k, []);
      groups.get(k).push(c);
    });

    // 字段名以**后端为准**：dim / value_a / source_a / value_b / type
    // ★ M22 修 bug：原先读 c.dimension / c.primary_value / c.category
    //   与后端字段对不上 → 维度、主源、镜像源、类别四列**恒为空**。
    const isGrade = v => /^[A-E]$/.test(String(v??'').trim());

    // 一个「值」的渲染：纯等级用大号等宽；说明性文本用小字灰色
    //   （源A jojowiki 常有 '?※Power: Likely A (JoJoveller p.245)' 这类
    //    36 字符的说明，直接大号显示会撑破布局）
    const valCell = (v, cls) => {
      if(v===null || v===undefined || v==='')
        return `<span class="cf-v cf-none">—</span>`;
      const s = String(v);
      if(isGrade(s)) return `<span class="cf-v cf-grade ${cls||''}">${esc(s)}</span>`;
      return `<span class="cf-v cf-text ${cls||''}" title="${esc(s)}">${esc(s)}</span>`;
    };

    // 置信度小进度条
    const confBar = c => {
      if(c===null || c===undefined) return '';
      const pct = Math.round(Number(c)*100);
      const col = pct>=80 ? 'var(--ok)' : pct>=60 ? 'var(--warn)' : 'var(--err)';
      return `<span class="cf-conf"><span class="cf-conf-bar">
        <i style="width:${pct}%;background:${col}"></i></span>
        <b>${pct}%</b></span>`;
    };

    // 敏感性：维基/库里用 **脆弱** 标记（Markdown 粗体），转成警示色
    const sens = s => {
      if(!s) return '';
      const frag = /脆弱/.test(s);
      const txt = esc(String(s).replace(/\*\*/g,''));
      return `<span class="cf-sens ${frag?'bad':'ok'}">
        ${frag?'⚠':'✓'} ${txt}</span>`;
    };

    const STRAT = {prefer_primary:'采主源', keep_unknown:'保留未知',
                   split_by_form:'按形态拆分'};

    const cards = [...groups.values()].map(rows=>{
      const h = rows[0];
      const dim = h.dim || h.stat_dim || '';
      const dimCn = h.dim_cn || dim;
      const resolved = h.resolved_value;
      const pending = (resolved===null || resolved===undefined);
      // 源对比行：第一行是主源参考，其余行交替展示 主源 vs 该镜像源
      const srcRows = rows.map(x=>`
        <tr>
          <td class="cf-src">${esc(x.source_a||'—')}</td>
          <td>${valCell(x.value_a)}</td>
          <td class="cf-vs">vs</td>
          <td class="cf-src">${esc(x.source_b||'—')}</td>
          <td>${valCell(x.value_b)}</td>
        </tr>`).join('');
      return `<div class="cf-card ${pending?'is-pending':''}">
        <div class="cf-head">
          <span class="cf-stand">${esc(h.stand_name||h.stand_id)}</span>
          <span class="cf-dim">${esc(dimCn)}</span>
          ${h.part?`<span class="cf-part">第${esc(h.part)}部</span>`:''}
          <span class="cf-state ${pending?'p':'r'}">${pending?'保留未知':'已消解'}</span>
        </div>
        <table class="cf-srcs"><tbody>${srcRows}</tbody></table>
        <div class="cf-foot">
          <div class="cf-line">
            <span class="cf-k">采纳</span>
            ${pending
              ? `<span class="cf-v cf-none" title="刻意的保留未知，不是失败">保留未知</span>`
              : valCell(h.resolved_label ?? resolved, 'is-pick')}
            <span class="cf-k">策略</span>
            <span class="cf-tag">${esc(STRAT[h.resolution]||h.resolution||'—')}</span>
            ${confBar(h.confidence)}
          </div>
          ${h.rationale
            ? `<div class="cf-line cf-reason">
                 <span class="cf-k">理由</span>
                 <span>${esc(String(h.rationale).replace(/\*\*/g,''))}</span></div>`
            : `<div class="cf-line cf-reason cf-noreason">
                 <span class="cf-k">理由</span>
                 <span>该条无消解日志（初始状态）</span></div>`}
          ${h.sensitivity?`<div class="cf-line">${sens(h.sensitivity)}</div>`:''}
        </div>
      </div>`;
    }).join('');

    // 顶部：总数 + 状态分布（未消解 = 刻意的保留未知，值得标出来）
    const nPend = list.filter(c=>c.resolved_value===null
                          || c.resolved_value===undefined).length;
    $('#cans').innerHTML = `<div class="cf-sum">
        <b>${groups.size}</b> 组冲突 · 共 ${list.length} 条源对比 ·
        <span class="cf-state p">保留未知 ${nPend}</span>
        <span class="cf-state r">已消解 ${list.length-nPend}</span>
      </div>${cards}`;
  }catch(e){
    $('#cans').innerHTML = `<div class="card"><div class="alert err">${esc(e.message)}</div></div>`;
  }
}

// ---------- 状态 ----------
async function loadS(){
  $('#sans').innerHTML = '<div class="loading">加载中…</div>';
  try{
    const [h, st] = await Promise.all([
      fetch(`${API}/health`).then(r=>r.json()),
      fetch(`${API}/stats`).then(r=>r.json())
    ]);
    const rs = h.resolution_stats||{};
    const dn = {0:'零分歧',1:'未消解',2:'待定',3:'已定'};
    $('#sans').innerHTML = `
      <div class="card"><h3>服务状态</h3>
        <dl class="kv">
          <dt>状态</dt><dd class="${h.status==='ok'?'ok':'bad'}">${esc(h.status)}</dd>
          <dt>数据库</dt><dd>${esc(h.database)}</dd>
          <dt>替身数</dt><dd>${esc(h.n_stands)}</dd>
          <dt>向量检索</dt><dd>${h.vector_enabled?'启用':'未启用（纯 BM25）'}</dd>
          <dt>未消解冲突</dt><dd>${esc(h.n_unresolved_conflicts)}</dd>
        </dl></div>
      <div class="card"><h3>冲突消解统计</h3>
        <table><thead><tr><th>维度</th><th style="text-align:right">总数</th>
          <th style="text-align:right">已定值</th><th style="text-align:right">未消解</th>
          <th style="text-align:right">状态</th></tr></thead><tbody>
        ${Object.entries(rs).map(([k,v])=>`
          <tr><td>${esc(dn[v.n]??k)}</td>
            <td class="num">${v.n}</td><td class="num">${v.n_resolved}</td>
            <td class="num bad">${v.n-v.n_resolved}</td>
            <td class="num">${v.n?(v.n_resolved/v.n*100).toFixed(0):0}%</td></tr>`).join('')}
        </tbody></table></div>
      <div class="card"><h3>数据质量</h3>
        <pre style="font-size:12px;white-space:pre-wrap">${
          esc(JSON.stringify(st.data_quality||st, null, 2))}</pre></div>`;
  }catch(e){
    $('#sans').innerHTML = `<div class="card"><div class="alert err">${esc(e.message)}</div></div>`;
  }
}
